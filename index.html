<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChatUP</title>
<meta name="theme-color" content="#5B3FF5">
<meta name="description" content="ChatUP: הודעות, שיחות קול ווידאו, קבוצות וסטטוסים">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ChatUP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Secular+One&family=Bangers&display=swap">
<style>
/* Layout: rail + chat list + conversation on desktop; one screen with bottom tabs on phones. Squircle avatars, violet ink bubbles, sun-yellow read ticks. */
:root{
  --bg:#F1F0F7; --panel:#FFFFFF; --panel2:#F6F5FB; --hover:#F1EFFA; --ink:#17152B; --muted:#6B6886; --line:#E4E2EF;
  --accent:#5B3FF5; --accent-ink:#FFFFFF; --accent-soft:#ECE8FE;
  --out:#5B3FF5; --out-ink:#FFFFFF; --out-muted:rgba(255,255,255,.74); --in:#FFFFFF; --in-ink:#17152B;
  --wall:#E8E6F3; --wall-dot:rgba(91,63,245,.10); --read:#FFD34D; --read-list:#5B3FF5;
  --ok:#14935F; --danger:#D93D44; --warn:#D9840F; --scrim:rgba(18,16,36,.45);
  --shadow:0 1px 1px rgba(23,21,43,.05),0 8px 28px rgba(23,21,43,.10);
  --bshadow:0 1px 1px rgba(23,21,43,.07);
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant","Segoe UI",Arial,system-ui,sans-serif;
  --msg-fs:15.5px; --sidew:clamp(340px,34vw,420px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --panel:#1C1C1E; --panel2:#242426; --hover:#2C2C2F; --ink:#EDEDEF; --muted:#A1A1A6; --line:#333336;
  --accent:#8571FF; --accent-ink:#FFFFFF; --accent-soft:#2D2A3E;
  --out:#5B3FF5; --out-ink:#FFFFFF; --out-muted:rgba(255,255,255,.72); --in:#2A2A2D; --in-ink:#EDEDEF;
  --wall:#161618; --wall-dot:rgba(255,255,255,.06); --read:#FFD34D; --read-list:#FFD34D;
  --ok:#3CC48A; --danger:#F06A70; --warn:#F0A93A; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45); --bshadow:0 1px 1px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --panel:#1C1C1E; --panel2:#242426; --hover:#2C2C2F; --ink:#EDEDEF; --muted:#A1A1A6; --line:#333336;
  --accent:#8571FF; --accent-ink:#FFFFFF; --accent-soft:#2D2A3E;
  --out:#5B3FF5; --out-ink:#FFFFFF; --out-muted:rgba(255,255,255,.72); --in:#2A2A2D; --in-ink:#EDEDEF;
  --wall:#161618; --wall-dot:rgba(255,255,255,.06); --read:#FFD34D; --read-list:#FFD34D;
  --ok:#3CC48A; --danger:#F06A70; --warn:#F0A93A; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 1px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.45); --bshadow:0 1px 1px rgba(0,0,0,.35);
  color-scheme:dark}
body.hc{--muted:var(--ink);--line:var(--muted)}
body.noanim *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:12px;color:var(--muted);flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib.danger{color:var(--danger)}
.flip svg,.flip{transform:scaleX(-1)}

/* ---------- shell ---------- */
#app{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:1fr auto;position:relative}
#rail{display:none}
#side{grid-row:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);position:relative}
#sideView{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#main{position:fixed;inset:0;z-index:20;background:var(--wall);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:slideIn .22s ease}
#app.chat-open #main{display:flex}
@keyframes slideIn{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
#bottom{grid-row:2;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.nb .pill{width:56px;height:32px;border-radius:12px;display:grid;place-items:center;transition:background .2s}
.nb.on{color:var(--ink)}
.nb.on .pill{background:var(--accent-soft);color:var(--accent)}
.nb .nbadge{position:absolute;top:0;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
#pages{position:fixed;inset:0;z-index:30;background:var(--panel);padding-top:env(safe-area-inset-top,0px)}
@media (min-width:900px){
  #app{grid-template-columns:76px var(--sidew) 1fr;grid-template-rows:1fr}
  #rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;background:var(--panel2);border-inline-end:1px solid var(--line);grid-column:1;grid-row:1}
  #rail .nb{flex:none;width:100%}
  #rail .sp{flex:1}
  #side{grid-column:2;border-inline-end:1px solid var(--line)}
  #main{position:relative;inset:auto;display:flex;grid-column:3;grid-row:1;z-index:auto;padding-top:0;animation:none;min-width:0}
  #bottom{display:none}
  #pages{position:absolute;inset-block:0;inset-inline-start:76px;width:var(--sidew);border-inline-end:1px solid var(--line);padding-top:0}
  .back{display:none!important}
}

/* ---------- side headers & lists ---------- */
.shead{display:flex;align-items:center;gap:2px;padding:14px 12px 6px 8px;padding-inline-start:16px}
.logo{font-family:var(--f-display);font-size:27px;line-height:1;margin-inline-end:auto;letter-spacing:.3px;direction:ltr}
.logo b{font-weight:400;color:var(--accent)}
.htitle{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;margin-inline-end:auto}
.search{margin:6px 16px 8px;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:42px;color:var(--muted)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink)}
.chips{display:flex;gap:8px;padding:2px 16px 10px;overflow-x:auto;scrollbar-width:none;flex:none}
.chip{padding:5px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.list{flex:1;overflow-y:auto;min-height:0;padding-bottom:90px}
.sec{padding:14px 16px 6px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;position:relative;width:100%;user-select:none;-webkit-user-select:none}
.row:hover{background:var(--hover)}
.row.sel{background:var(--accent-soft)}
.rm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt,.rb{display:flex;align-items:center;gap:6px;min-width:0}
.rn{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.rtime.hot{color:var(--accent);font-weight:700}
.rp{flex:1;min-width:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.rp span{overflow:hidden;text-overflow:ellipsis}
.rp .typing{color:var(--accent);font-weight:600}
.rp .draft{color:var(--danger);font-weight:600}
.rp svg.i{width:16px;height:16px}
.rflags{display:flex;align-items:center;gap:4px;color:var(--muted);flex:none}
.rflags svg.i{width:16px;height:16px}
.badge{min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.dim{background:var(--muted)}
.vbadge{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;flex:none}
.vbadge svg.i{width:11px;height:11px;stroke-width:3}
.av{border-radius:34%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden;position:relative;letter-spacing:.5px}
.av img{width:100%;height:100%;object-fit:cover}
.avw{position:relative;flex:none;display:inline-flex}
.online{position:absolute;bottom:-1px;inset-inline-end:-1px;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--panel)}
.fab{position:absolute;bottom:18px;inset-inline-end:16px;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);z-index:2}
.fab.sm{width:44px;height:44px;border-radius:14px;bottom:86px;background:var(--panel);color:var(--accent);border:1px solid var(--line)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.arow{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;font-weight:700}
.arow .aic{width:48px;display:grid;place-items:center;color:var(--accent)}
.arow:hover{background:var(--hover)}
.arow .cnt{margin-inline-start:auto;color:var(--accent);font-size:13px}

/* ---------- conversation ---------- */
.chead{display:flex;align-items:center;gap:4px;padding:8px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;min-height:60px}
.chwho{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:2px 6px;border-radius:12px}
.chwho b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chwho small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chwho small.on{color:var(--accent);font-weight:600}
.pinbar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.pinbar svg.i{color:var(--accent);width:18px;height:18px}
.pinbar span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csearch{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.csearch input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:12px;height:38px;padding:0 12px;outline:0}
.msgs{flex:1;overflow-y:auto;min-height:0;padding:12px 16px 10px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.wall-dots{background-color:var(--wall);background-image:radial-gradient(var(--wall-dot) 1.3px,transparent 1.5px);background-size:18px 18px}
.wall-grid{background-color:var(--wall);background-image:linear-gradient(var(--wall-dot) 1px,transparent 1px),linear-gradient(90deg,var(--wall-dot) 1px,transparent 1px);background-size:26px 26px}
.wall-waves{background-color:var(--wall);background-image:repeating-radial-gradient(circle at 0 100%,transparent 0 14px,var(--wall-dot) 15px 16px,transparent 17px 30px)}
.wall-plain{background:var(--wall)}
.wall-dusk{background:linear-gradient(170deg,#3b2a7a 0%,#8b4a8c 45%,#f08a5d 100%)}
.wall-mint{background:linear-gradient(170deg,#c9f1e1 0%,#a8d8f0 100%)}
.wall-night{background:radial-gradient(circle at 70% 20%,#2b2660 0,#0f0d22 70%)}
.daysep{align-self:center;margin:10px 0 6px;padding:4px 12px;border-radius:10px;background:var(--panel);color:var(--muted);font-size:12.5px;font-weight:700;box-shadow:var(--bshadow)}
.sys{align-self:center;margin:6px 0;padding:5px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13px;text-align:center;max-width:90%}
.note{align-self:center;margin:4px 0 10px;padding:8px 14px;border-radius:12px;background:var(--panel);color:var(--muted);font-size:12.5px;text-align:center;max-width:min(92%,420px);display:flex;gap:6px;align-items:center}
.note svg.i{width:15px;height:15px;color:var(--accent)}
.msg{display:flex;flex-direction:column;max-width:min(80%,560px);position:relative;margin-top:6px}
.msg.g{margin-top:0}
.msg.out{align-self:flex-end}
.msg.in{align-self:flex-start}
.msg.hasr{margin-bottom:16px}
.bub{padding:6px 10px 7px;border-radius:18px;font-size:var(--msg-fs);position:relative;box-shadow:var(--bshadow);overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.out .bub{background:var(--out);color:var(--out-ink)}
.in .bub{background:var(--in);color:var(--in-ink)}
.out:not(.g) .bub{border-end-end-radius:6px}
.in:not(.g) .bub{border-end-start-radius:6px}
.msg.flash .bub{animation:flash 1.2s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--read)}100%{box-shadow:var(--bshadow)}}
.who{font-size:13px;font-weight:800;margin-bottom:1px}
.fwd{font-size:12.5px;font-style:italic;opacity:.75;display:flex;align-items:center;gap:4px;margin-bottom:2px}
.fwd svg.i{width:14px;height:14px}
.quote{display:block;width:100%;border-radius:10px;padding:6px 10px;margin:2px 0 4px;background:rgba(0,0,0,.06);border-inline-start:4px solid var(--accent);font-size:13.5px;text-align:start}
.out .quote{background:rgba(255,255,255,.16);border-color:var(--read)}
.quote b{display:block;font-size:13px}
.quote span{display:block;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt{white-space:pre-wrap}
.txt a{color:inherit;text-decoration:underline}
.txt.big{font-size:38px;line-height:1.15}
.sp{display:inline-block;width:56px;height:10px}
.out .sp{width:74px}
.sp.wide{width:96px}
.meta{position:absolute;bottom:4px;left:10px;display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--in-meta,var(--muted));direction:ltr;white-space:nowrap}
.out .meta{color:var(--out-muted)}
.meta svg.i{width:13px;height:13px}
.meta em{font-style:normal}
.meta.onimg{background:rgba(0,0,0,.45);color:#fff;padding:1px 6px;border-radius:8px;bottom:10px;left:14px}
.tk{width:17px!important;height:17px!important;stroke-width:2.2!important}
.tk.read{color:var(--read)}
.rp .tk.read{color:var(--read-list)}
.del{font-style:italic;opacity:.75;display:inline-flex;align-items:center;gap:6px}
.del svg.i{width:15px;height:15px}
.mchev{position:absolute;top:4px;left:4px;width:26px;height:22px;border-radius:8px;display:none;place-items:center;background:inherit;color:inherit;opacity:.85}
.mchev svg.i{width:16px;height:16px}
@media (hover:hover){.msg:hover .mchev{display:grid}}
.reacts{position:absolute;bottom:-15px;inset-inline-start:10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-size:13px;height:24px;display:flex;align-items:center;gap:2px;box-shadow:var(--bshadow)}
.out .reacts{inset-inline-start:auto;inset-inline-end:10px}
.reacts small{font-size:12px;color:var(--muted);font-weight:700;margin-inline-start:2px}
.imgw{display:block;margin:-2px -6px 4px;border-radius:14px;overflow:hidden;max-width:300px;line-height:0}
.imgw img{width:100%;max-height:340px;object-fit:cover}
.voice{display:flex;align-items:center;gap:10px;min-width:220px;padding:4px 0 10px}
.vplay{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(0,0,0,.08);flex:none}
.out .vplay{background:rgba(255,255,255,.18)}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:30px}
.wave i{flex:1;border-radius:2px;background:currentColor;opacity:.35;min-height:3px}
.wave i.p{opacity:1}
.vdur{font-size:12px;font-variant-numeric:tabular-nums;position:absolute;bottom:4px;right:58px;opacity:.75}
.vspeed{font-size:12px;font-weight:800;padding:2px 7px;border-radius:9px;background:rgba(0,0,0,.08)}
.out .vspeed{background:rgba(255,255,255,.18)}
.doc{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:0 -4px 6px;border-radius:12px;background:rgba(0,0,0,.06);min-width:220px}
.out .doc{background:rgba(255,255,255,.14)}
.doc b{display:block;font-size:14px;overflow-wrap:anywhere}
.doc small{opacity:.75;font-size:12px}
.loc{display:block;color:inherit;text-decoration:none;margin:-2px -6px 6px;border-radius:14px;overflow:hidden;min-width:240px}
.loc svg.map{display:block;width:100%;height:120px}
.loc div{padding:6px 8px 0}
.loc b{display:block;font-size:14px}
.loc small{opacity:.75;font-size:12px}
.ccard{display:flex;align-items:center;gap:10px;padding:4px 0 8px;min-width:220px}
.ccard b{display:block}
.ccard small{opacity:.75}
.cbtn{display:block;width:calc(100% + 20px);margin:0 -10px -7px;padding:8px;border-top:1px solid rgba(127,127,160,.25);text-align:center;font-weight:700;font-size:14px;color:inherit}
.in .cbtn{color:var(--accent)}
.poll{min-width:250px;padding-bottom:12px}
.poll>b{display:block;font-size:16px;margin-bottom:2px}
.poll>small{display:block;opacity:.75;font-size:12.5px;margin-bottom:8px}
.popt{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:8px;width:100%;padding:6px 0 10px;position:relative}
.pchk{width:20px;height:20px;border-radius:7px;border:2px solid currentColor;opacity:.7;display:grid;place-items:center}
.popt.on .pchk{background:currentColor;opacity:1}
.popt.on .pchk::after{content:"";width:8px;height:4px;border:solid var(--out);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.in .popt.on .pchk::after{border-color:var(--in)}
.pcnt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.pbar{position:absolute;bottom:3px;inset-inline-start:30px;inset-inline-end:0;height:5px;border-radius:3px;background:rgba(127,127,160,.25);overflow:hidden}
.pbar::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:var(--w);background:currentColor;border-radius:3px;transition:width .3s}
.in .pbar::after{background:var(--accent)}
.ptot{font-size:12.5px;opacity:.75}
.evt{display:flex;gap:12px;align-items:center;min-width:230px;padding:2px 0 8px}
.edate{width:52px;height:56px;border-radius:14px;background:rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.out .edate{background:rgba(255,255,255,.18)}
.edate b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1}
.edate small{font-size:12px;font-weight:700}
.evt b{display:block}
.evt small{opacity:.8;font-size:13px}
.callm{display:flex;align-items:center;gap:10px;padding:4px 0 8px;min-width:200px}
.callm .cic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(0,0,0,.08)}
.out .callm .cic{background:rgba(255,255,255,.18)}
.callm .miss{color:var(--danger)}
.callm b{display:block}
.callm small{opacity:.75}
.typingb .bub{display:flex;gap:4px;padding:12px 14px}
.typingb i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1.2s infinite}
.typingb i:nth-child(2){animation-delay:.15s}.typingb i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.mainempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px;text-align:center;color:var(--muted)}
.mainempty .mark{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--ink);direction:ltr}
.mainempty .mark b{color:var(--accent);font-weight:400}
.mainempty p{max-width:380px;margin:0;font-size:16px}
.mainempty .lk{display:flex;gap:6px;align-items:center;font-size:13px}

/* composer */
.composer{flex:none;padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.cbar{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:16px 16px 6px 6px;padding:8px 12px;margin-bottom:4px;border-inline-start:4px solid var(--accent);font-size:14px}
.cbar div{flex:1;min-width:0}
.cbar b{display:block;color:var(--accent);font-size:13px}
.cbar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.crow{display:flex;align-items:flex-end;gap:8px}
.cfield{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--panel);border-radius:22px;padding:4px;box-shadow:var(--bshadow)}
.cfield textarea{flex:1;min-width:0;border:0;outline:0;background:none;resize:none;max-height:140px;padding:9px 4px;line-height:1.4;font-size:var(--msg-fs);color:var(--ink)}
.sendbtn{width:48px;height:48px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:var(--bshadow)}
.cblock{background:var(--panel);border-radius:16px;padding:14px;text-align:center;color:var(--muted);font-size:14px}
.cblock button{color:var(--accent);font-weight:700}
.emojis{background:var(--panel);border-radius:18px;margin-top:6px;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));max-height:220px;overflow-y:auto}
.emojis button{font-size:24px;height:42px;border-radius:10px}
.emojis button:hover{background:var(--hover)}
.recbar{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:22px;padding:4px 10px;height:48px;min-width:0}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#rect{font-variant-numeric:tabular-nums;font-weight:700}
.recwave{flex:1;display:flex;align-items:center;gap:2px;height:28px;overflow:hidden;color:var(--accent);min-width:0}
.recwave i{width:3px;border-radius:2px;background:currentColor;flex:none}
.rechint{font-size:12px;color:var(--muted)}

/* ---------- pages ---------- */
.page{height:100%;display:flex;flex-direction:column;animation:pageIn .2s ease}
@keyframes pageIn{from{transform:translateX(-18px);opacity:.3}to{transform:none;opacity:1}}
.phead{display:flex;align-items:center;gap:4px;padding:10px 8px;min-height:60px;border-bottom:1px solid var(--line);flex:none}
.phead h2{margin:0;font-size:19px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{flex:1;overflow-y:auto;min-height:0;padding-bottom:40px;position:relative}
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;cursor:pointer;text-align:start}
.srow:hover{background:var(--hover)}
.srow .sic{width:26px;display:grid;place-items:center;color:var(--muted);flex:none}
.srow .stx{flex:1;min-width:0}
.srow .stx b{display:block;font-weight:600;font-size:15.5px}
.srow .stx small{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.srow>svg.i:last-child{width:18px;height:18px;color:var(--muted);transform:scaleX(-1)}
.srow.danger,.srow.danger .sic{color:var(--danger)}
.srow.accent,.srow.accent .sic{color:var(--accent)}
.gap{height:8px;background:var(--bg)}
.plabel{padding:16px 16px 4px;font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.3px}
.ptext{padding:10px 16px;color:var(--muted);font-size:13.5px}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .2s}
.sw:checked{background:var(--accent)}
.sw:checked::after{inset-inline-start:21px}
.radio{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;margin:0;display:grid;place-items:center}
.radio:checked{border-color:var(--accent)}
.radio:checked::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--accent)}
.chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);flex:none;margin:0;display:grid;place-items:center}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px 14px;text-align:center}
.hero h3{margin:4px 0 0;font-size:23px;font-weight:800}
.hero p{margin:0;color:var(--muted)}
.hero .acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.hbtn{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:78px;padding:10px 8px;border:1px solid var(--line);border-radius:16px;color:var(--accent);font-size:13px;font-weight:700}
.hbtn:hover{background:var(--hover)}
.avedit{position:relative}
.avedit .cam{position:absolute;bottom:-4px;inset-inline-end:-4px;width:40px;height:40px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;border:3px solid var(--panel)}
.media{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px 16px 12px}
.media img,.media .mph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--panel2);max-width:100%}
.field{display:flex;flex-direction:column;gap:6px;padding:8px 16px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.inp{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:0 14px;outline:0;color:var(--ink)}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:auto;min-height:90px;padding:10px 14px;resize:vertical}
.btn{height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:0 20px;display:inline-grid;place-items:center}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.red{background:var(--danger);color:#fff}
.btn.full{width:100%}
.btns{display:flex;gap:10px;padding:12px 16px}
.btns .btn{flex:1}
.bar{height:12px;border-radius:6px;background:var(--panel2);overflow:hidden;display:flex;margin:6px 16px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;padding:4px 16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.qr{display:grid;place-items:center;padding:24px}
.qr svg{width:220px;height:220px;max-width:100%;background:#fff;border-radius:22px;padding:14px}
.faq details{border-bottom:1px solid var(--line);padding:12px 16px}
.faq summary{font-weight:700;cursor:pointer}
.faq p{color:var(--muted);margin:8px 0 0}
.copybox{margin:8px 16px;display:flex;align-items:center;gap:8px;border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;direction:ltr}
.copybox code{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* ---------- updates / communities / calls ---------- */
.stories{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none}
.story{width:96px;height:150px;border-radius:18px;flex:none;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff;font-size:12.5px;font-weight:700;text-align:start;background:#333}
.story .sbg{position:absolute;inset:0;display:grid;place-items:center;padding:10px;font-size:13px;text-align:center;line-height:1.25}
.story .sbg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.55))}
.story>*{position:relative;z-index:1}
.story .sav{position:absolute;top:8px;inset-inline-start:8px;z-index:2;border-radius:13px;padding:2px;background:var(--accent)}
.story.seen .sav{background:rgba(255,255,255,.5)}
.story .sav .av{border:2px solid #000}
.story.add{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.story.add::after{display:none}
.story .plus{position:absolute;top:56px;inset-inline-start:50%;transform:translateX(50%);width:34px;height:34px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center}
.flw{height:32px;padding:0 14px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;flex:none}
.flw.on{background:var(--panel2);color:var(--muted)}
.chcards{display:flex;gap:10px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none}
.chcard{flex:none;width:150px;border:1px solid var(--line);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.chcard b{font-size:14px}
.chcard small{color:var(--muted);font-size:12px}
.comm{margin:8px 12px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.comm .row{padding:10px 12px}
.ci{width:16px;height:16px}
.cin{color:var(--ok)}.cmiss{color:var(--danger)}.cout{color:var(--accent)}
.rsub{display:flex;align-items:center;gap:4px;font-size:13.5px;color:var(--muted)}
.rsub svg.i{width:15px;height:15px}
.rsub.miss{color:var(--danger)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;max-height:88%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease;box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px;max-height:80%}}
.sh{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.sh h3{margin:0;font-size:18px;font-weight:800;flex:1}
.sb{overflow-y:auto;min-height:0;padding-bottom:12px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.reactrow{display:flex;justify-content:space-between;gap:4px;padding:8px 14px 10px;margin:0 12px 6px;background:var(--panel2);border-radius:999px}
.re{font-size:26px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.re.on{background:var(--accent-soft)}
.re.more{font-size:22px;color:var(--muted);font-weight:700}
.preview{margin:0 16px 8px;padding:10px 12px;border-radius:14px;background:var(--panel2);font-size:14px;color:var(--muted);max-height:80px;overflow:hidden}
.atgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:10px 16px 18px}
.att{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600}
.att span{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff}
.menu{position:fixed;z-index:70;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:6px;min-width:220px;max-width:calc(100vw - 24px);animation:fade .12s}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;font-size:15px;text-align:start}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}
.menu svg.i{width:19px;height:19px;color:var(--muted)}
.menu button.danger svg.i{color:var(--danger)}
.toast{position:fixed;z-index:90;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center;animation:up .2s}
.banner{position:fixed;z-index:85;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;animation:down .25s}
@keyframes down{from{transform:translate(-50%,-20px);opacity:0}}
.banner b{display:block;font-size:14px}
.banner .rm span{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .rm{min-width:0}
.pin{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 16px 20px}
.pindots{display:flex;gap:14px;direction:ltr}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.pindots i.f{background:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;direction:ltr}
.pinpad button{height:60px;border-radius:18px;background:var(--panel2);font-size:24px;font-weight:700}
.pinpad button:hover{background:var(--hover)}
.pinerr{color:var(--danger);font-weight:700;min-height:20px;font-size:14px}
.lock{position:fixed;inset:0;z-index:95;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px}
.lock .logo{margin:0 0 10px;font-size:40px}

/* status viewer / call — deliberately dark on any theme */
.viewer{position:fixed;inset:0;z-index:80;background:#07060f;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vbars{display:flex;gap:4px;padding:10px 12px 6px;direction:ltr;flex-direction:row-reverse}
.vbars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;position:relative}
.vbars i b{position:absolute;inset:0;right:auto;background:#fff;width:0;left:auto;right:0}
.vhead{display:flex;align-items:center;gap:10px;padding:6px 10px}
.vhead .rm b{font-size:15px}
.vhead .rm small{color:rgba(255,255,255,.7)}
.vhead .ib{color:#fff}
.vhead .ib:hover{background:rgba(255,255,255,.12)}
.vbody{flex:1;min-height:0;display:grid;place-items:center;position:relative;user-select:none;-webkit-user-select:none}
.vbody img{max-width:100%;max-height:100%;object-fit:contain}
.vtext{width:100%;height:100%;display:grid;place-items:center;padding:30px;font-size:clamp(24px,6vw,40px);font-weight:700;text-align:center;line-height:1.3;white-space:pre-wrap}
.vcap{position:absolute;bottom:14px;left:0;right:0;text-align:center;padding:8px 16px;background:rgba(0,0,0,.4)}
.vfoot{display:flex;gap:8px;padding:10px 12px;align-items:center}
.vfoot input{flex:1;min-width:0;height:46px;border-radius:23px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;padding:0 18px;outline:0}
.vfoot input::placeholder{color:rgba(255,255,255,.6)}
.vfoot .sendbtn{background:#5B3FF5;color:#fff}
.vfoot .views{flex:1;display:flex;align-items:center;gap:6px;justify-content:center;color:rgba(255,255,255,.85)}
.tcomp textarea{width:100%;height:100%;background:transparent;border:0;outline:0;resize:none;color:#fff;font-size:clamp(24px,6vw,40px);font-weight:700;text-align:center;padding:30% 24px 0}
.tcomp textarea::placeholder{color:rgba(255,255,255,.65)}
.call{position:fixed;inset:0;z-index:82;color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(30px + env(safe-area-inset-top,0px)) 16px calc(30px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 25%,var(--cc,#5B3FF5) 0%,#0b0a18 72%)}
.call .clabel{font-size:13px;opacity:.75;display:flex;align-items:center;gap:6px}
.call h2{font-size:30px;margin:18px 0 4px;font-weight:800;text-align:center}
.call .cstat{opacity:.85;font-variant-numeric:tabular-nums;font-size:16px}
.call .cav{margin-top:34px}
.call .cav .av{box-shadow:0 0 0 10px rgba(255,255,255,.08),0 0 0 22px rgba(255,255,255,.04)}
.call .ring .av{animation:ring 1.6s infinite}
@keyframes ring{50%{box-shadow:0 0 0 16px rgba(255,255,255,.12),0 0 0 34px rgba(255,255,255,.05)}}
.selfcam{position:absolute;top:calc(80px + env(safe-area-inset-top,0px));inset-inline-end:16px;width:100px;height:140px;border-radius:18px;background:linear-gradient(160deg,#2c2851,#141228);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:12px;opacity:.9}
.cctl{margin-top:auto;display:flex;gap:16px;background:rgba(255,255,255,.08);padding:14px 18px;border-radius:28px;flex-wrap:wrap;justify-content:center}
.cctl button{width:58px;height:58px;border-radius:20px;background:rgba(255,255,255,.12);display:grid;place-items:center;color:#fff}
.cctl button.on{background:#fff;color:#141228}
.cctl button.end{background:#E0464C}
.cctl button.ans{background:#14935F}

/* onboarding */
.onb{position:fixed;inset:0;z-index:96;background:var(--bg);overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px}
.onbc{width:100%;max-width:440px;background:var(--panel);border-radius:28px;padding:28px 8px 20px;box-shadow:var(--shadow);margin:auto}
.onbc .logo{font-size:52px;text-align:center;margin:0 0 6px;display:block}
.onbc .tag{text-align:center;color:var(--muted);margin:0 16px 18px;font-size:16px}
.phonein{display:flex;gap:8px;direction:ltr}
.phonein select{width:110px;flex:none}
.small{font-size:12.5px;color:var(--muted);text-align:center;padding:8px 16px 0}
.gate{position:fixed;inset:0;z-index:97;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .onbc{text-align:center;padding:30px 20px}
.gate p{color:var(--muted);max-width:44ch;margin:8px auto}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:18px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.livedot{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ok);padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.livedot i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.livedot.off{color:var(--muted)}.livedot.off i{background:var(--muted)}
.pend{opacity:.85}
.joincard{margin:16px;padding:16px;border:1px solid var(--line);border-radius:18px;text-align:center}
.vid{display:block;width:280px;max-width:100%;max-height:360px;border-radius:14px;margin:-2px -6px 4px;background:#000}

.lnk{color:var(--accent);font-weight:700}
.voicew{display:flex;align-items:center;gap:8px;padding:2px 0 12px}
.voicew audio{height:40px;width:240px;max-width:100%}
.recbtn{width:76px;height:76px;border-radius:50%;border:6px solid #fff;background:#E0464C;transition:border-radius .2s,transform .2s}
.recbtn.on{border-radius:22px;transform:scale(.86)}
.call .rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.call.isvid{background:#000}
.call .ctop{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.call .cav,.call .cctl{position:relative;z-index:2}
.call .lv{position:absolute;top:calc(100px + env(safe-area-inset-top,0px));inset-inline-end:16px;width:108px;height:150px;object-fit:cover;border-radius:18px;border:2px solid rgba(255,255,255,.45);z-index:3;background:#1b1930}
.call .lv.mir{transform:scaleX(-1)}
.cctl button.ans2{background:#0B8FB3}

/* wallpaper picker */
.wpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;padding:8px 16px 14px}
.wpt{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:12.5px;font-weight:700;min-width:0;width:100%}
.wpi{display:block;width:100%;aspect-ratio:9/16;border-radius:14px;border:3px solid var(--line);max-width:100%;background-color:var(--wall)}
.wpt.on .wpi{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wpn{text-align:center;line-height:1.25}
.wpc{position:relative}
.wpdel{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;z-index:1}
input[type=range]{width:100%;accent-color:var(--accent)}
/* bubble style picker */
.bsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:8px 16px 20px}
.bscard{display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:700;font-size:13.5px;min-width:0;width:100%}
.bsprev{width:100%;height:150px;flex:none;border-radius:16px;border:3px solid var(--line);padding:14px 10px;gap:10px;overflow:hidden;pointer-events:none;justify-content:center}
.bscard.on .bsprev{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bsprev .msg{max-width:90%;margin:0}.bsprev .bub{font-size:13.5px}
/* ---- message styles ---- */
.bs-football{--out:repeating-linear-gradient(90deg,#166b2c 0 18px,#115a24 18px 36px);--out-ink:#fff;--out-muted:rgba(255,255,255,.85);--in:#fff;--in-ink:#111;--in-meta:#555}
.bs-football .out .bub{border:2px solid rgba(255,255,255,.95);text-shadow:0 1px 1px rgba(0,0,0,.3)}
.bs-football .in .bub{border:2px solid #111}
.bs-football .msg:not(.g) .bub::after,.bs-basketball .msg:not(.g) .bub::after{content:"⚽";position:absolute;top:-11px;font-size:17px;line-height:1;pointer-events:none}
.bs-basketball .msg:not(.g) .bub::after{content:"🏀"}
.bs-football .out:not(.g) .bub::after,.bs-basketball .out:not(.g) .bub::after{left:-8px}
.bs-football .in:not(.g) .bub::after,.bs-basketball .in:not(.g) .bub::after{right:-8px}
.bs-basketball{--out:radial-gradient(circle at 0 50%,transparent 46px,rgba(70,25,0,.5) 47px 49px,transparent 50px),radial-gradient(circle at 100% 50%,transparent 46px,rgba(70,25,0,.5) 47px 49px,transparent 50px),linear-gradient(90deg,transparent calc(50% - 1px),rgba(70,25,0,.5) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),#f26b1d;--out-ink:#fff;--out-muted:rgba(255,255,255,.85);--in:#fdf0e1;--in-ink:#3b1d0a;--in-meta:#8a5a3a}
.bs-basketball .in .bub{border:2px solid #f26b1d}
.bs-basketball .out .bub{text-shadow:0 1px 1px rgba(0,0,0,.35)}
.bs-neon{--out:rgba(8,8,20,.85);--out-ink:#e0fbff;--out-muted:#7ee8fa;--in:rgba(8,8,20,.85);--in-ink:#ffe4f6;--in-meta:#f9a8d4}
.bs-neon .out .bub{border:1.5px solid #22d3ee;box-shadow:0 0 10px #22d3ee,inset 0 0 8px rgba(34,211,238,.35);text-shadow:0 0 6px rgba(34,211,238,.7)}
.bs-neon .in .bub{border:1.5px solid #f472b6;box-shadow:0 0 10px #f472b6,inset 0 0 8px rgba(244,114,182,.35);text-shadow:0 0 6px rgba(244,114,182,.6)}
.bs-neon .tk.read{color:#a3e635}
.bs-comic{--out:#ffe14d;--out-ink:#111;--out-muted:#333;--in:#fff;--in-ink:#111;--in-meta:#444}
.bs-comic .bub{border:3px solid #111;box-shadow:4px 4px 0 #111;border-radius:16px!important;font-family:"Bangers","Secular One",cursive;letter-spacing:.5px;font-size:calc(var(--msg-fs) + 1.5px)}
.bs-comic .out .bub{transform:rotate(-.8deg)}.bs-comic .in .bub{transform:rotate(.8deg)}
.bs-comic .tk.read{color:#e11d48}
.bs-retro{--out:#9bbc0f;--out-ink:#0f380f;--out-muted:#306230;--in:#c4cfa1;--in-ink:#0f380f;--in-meta:#306230}
.bs-retro .bub{border-radius:0!important;box-shadow:0 -4px 0 #0f380f,0 4px 0 #0f380f,-4px 0 0 #0f380f,4px 0 0 #0f380f;margin:4px;font-family:ui-monospace,"Courier New",monospace;font-weight:700}
.bs-retro .tk.read{color:#0f380f}
.bs-glass{--out:rgba(91,63,245,.42);--out-ink:#fff;--out-muted:rgba(255,255,255,.85);--in:rgba(0,0,0,.30);--in-ink:#fff;--in-meta:rgba(255,255,255,.8)}
.bs-glass .bub{backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);border:1px solid rgba(255,255,255,.35);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.bs-gold{--out:linear-gradient(135deg,#f9e29c,#d4a017 55%,#b8860b);--out-ink:#2b1d00;--out-muted:#5c4300;--in:#141414;--in-ink:#f5e6b8;--in-meta:#c9a24a}
.bs-gold .in .bub{border:1px solid #d4a017}.bs-gold .tk.read{color:#7c2d12}
.bs-candy{--out:linear-gradient(135deg,#ff7eb3,#ff758c);--out-ink:#fff;--out-muted:rgba(255,255,255,.85);--in:#f3e8ff;--in-ink:#4c1d95;--in-meta:#7c3aed}
.bs-candy .bub{border-radius:22px!important}
.bs-terminal{--out:#000;--out-ink:#39ff14;--out-muted:#1fa30d;--in:#0b0b0b;--in-ink:#e5e5e5;--in-meta:#8a8a8a}
.bs-terminal .bub{font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace;border:1px solid #1f3d1a;border-radius:4px!important}
.bs-terminal .out .txt::before{content:"> ";color:#39ff14}
.bs-ocean{--out:linear-gradient(135deg,#06b6d4,#2563eb);--out-ink:#fff;--out-muted:rgba(255,255,255,.85);--in:#e0f7ff;--in-ink:#083344;--in-meta:#0e7490}
.bs-minimal{--out:#111;--out-ink:#fff;--out-muted:#aaa;--in:#f2f2f2;--in-ink:#111;--in-meta:#777}
.bs-minimal .bub{box-shadow:none;border-radius:20px!important;border:1px solid rgba(127,127,127,.35)}
.who-tag{font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px}
</style>

  if(o.kind==='self')return `<span class="av" style="${s}">${esc(initials(o.init||o.name))}</span>`;
  if(o.kind==='community')return `<span class="av" style="${s};border-radius:30%">${ic('users',Math.round(size*.48))}</span>`;

  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')return;const t=audioCtx.currentTime;

}

function msgsOf(cid){
  const d=MS[cid]?.docs||{},c=CH[cid],pr=pref(cid),hid=new Set(ST.hidden[cid]||[]);let L=[];

  if(c?.disappear){const lim=Date.now()-c.disappear;L=L.filter(m=>m.type==='system'||m.t>=lim)}

function tickState(c,m){

const reactsOf=(cid,mid)=>{const r={};const R=RS[cid]||{};for(const u in R){const e=R[u]?.reacts?.[mid];if(e)r[u]=e}return r};
const votesOf=(cid,mid,n)=>{const v=Array.from({length:n},()=>[]);const R=RS[cid]||{};for(const u in R){(R[u]?.votes?.[mid]||[]).forEach(i=>{if(v[i])v[i].push(u)})}return v};

const isStarred=(cid,mid)=>(ST.starred[cid]||[]).includes(mid);
function msgBody(c,m,out){
  if(m.deleted)return `<span class="del">${ic('block')}${out?'מחקת את ההודעה הזו':'ההודעה נמחקה'}</span><span class="sp"></span>`;

    case 'doc':return `<a class="doc" ${String(m.url||'').startsWith('media:')?`data-media="${esc(m.url.slice(6))}" data-dl="${esc(m.name)}" href="#"`:m.url?`href="${esc(m.url)}" target="_blank" rel="noopener"`:''} style="color:inherit;text-decoration:none">${ic('file',30)}<div><b>${esc(m.name)}</b><small>${fmtSize(m.size||0)} · ${esc((String(m.name).split('.').pop()||'').toUpperCase())}</small></div></a>${sp}`;
    case 'location':return `<a class="loc" href="https://www.openstreetmap.org/?mlat=${+m.lat}&mlon=${+m.lng}#map=16/${+m.lat}/${+m.lng}" target="_blank" rel="noopener">${MAPSVG}<div><b>${m.live?'מיקום חי · ':''}${esc(m.label)}</b><small dir="ltr">${(+m.lat).toFixed(4)}, ${(+m.lng).toFixed(4)}</small></div></a>${sp}`;
    case 'contact':{const k=pobj(m.uid);return `<div class="ccard">${av(k,44)}<div><b>${esc(m.uid===ME?prof(ME).name:k.name)}</b><small dir="ltr">${esc(prof(m.uid).username?'@'+prof(m.uid).username:'')}</small></div></div>${sp}${m.uid!==ME?`<button class="cbtn" data-a="dm" data-uid="${esc(m.uid)}">שליחת הודעה</button>`:''}`}
    case 'poll':{
      const V=votesOf(c.id,m.id,m.opts.length);const voters=new Set();V.forEach(v=>v.forEach(x=>voters.add(x)));const tot=voters.size;

  }

function msgHTML(c,m,prev,all){
  if(m.type==='system')return `<div class="sys">${esc(sysText(m))}</div>`;
  const out=m.from===ME;
  const g=prev&&prev.type!=='system'&&prev.from===m.from&&m.t-prev.t<6*MIN&&sameDay(m.t,prev.t);
  let h='';
  if(c.type!=='direct'&&!out&&!g)h+=`<div class="who" style="color:${pobj(m.from).color}">${esc(pname(m.from))}</div>`;
  if(m.fwd&&!m.deleted)h+=`<div class="fwd">${ic('forward')}הועברה</div>`;
  if(m.status&&!m.deleted)h+=`<div class="fwd">${ic('status')}תגובה לסטטוס</div>`;
  if(m.reply&&!m.deleted){const r=all.find(x=>x.id===m.reply);if(r)h+=`<button class="quote" data-a="jump" data-mid="${r.id}"><b>${r.from===ME?'את/ה':esc(pname(r.from))}</b><span>${esc(previewText(r))}</span></button>`}
  h+=msgBody(c,m,out);

async function myBucket(cid){
  if(MB[cid])return MB[cid];
  let best=null;
  const local=MS[cid]?.docs;
  if(local&&MS[cid].loaded){for(const k in local){const b=local[k];if(b.by===ME&&(!best||b.n>best.n))best=b}}
  else{try{const s=await db.collection(`chats/${cid}/m`).where('by','==',ME).get();s.docs.forEach(x=>{const b=x.data();if(!best||b.n>best.n)best=b})}catch(e){dbErr(e)}}
  MB[cid]=best?clone(best):{by:ME,n:0,msgs:[]};
  return MB[cid];
}
const bucketPath=(cid,b)=>`chats/${cid}/m/${ME}~${b.n}`;
async function sendMsg(cid,msg){
  const c=CH[cid];if(!c)return;
  Object.keys(msg).forEach(k=>msg[k]===undefined&&delete msg[k]);
  const m={id:rid(12),t:Date.now(),...msg};
  let b=await myBucket(cid);
  if(b.msgs.length>=100||JSON.stringify(b).length+JSON.stringify(m).length>600000){b=MB[cid]={by:ME,n:b.n+1,msgs:[]}}
  b.msgs.push(m);
  const path=bucketPath(cid,b),body=clone(b);
  qw(path,()=>db.doc(path).set(body));
  if(c.type==='broadcast'){fanOut(c,m);}
  if(m.type!=='system'||['created','renamed','left','joined','added'].includes(m.ev)){
    const sent=(c.sent?.[ME]||0)+(m.type==='system'?0:1);
    const last={by:ME,t:m.t,type:m.type,text:m.type==='system'?sysText({...m,from:ME}).replace(/^את\/ה/,prof(ME).name||''):previewText(m)};
    qw('chats/'+cid,()=>db.doc('chats/'+cid).update({last,sent:{[ME]:sent},seen:{[ME]:m.t},dlv:{[ME]:m.t}}));
  }
  if(m.type!=='system')beep('sent');
  if(pref(cid).archived&&!S().keepArchived){pref(cid).archived=false;saveState()}
  if(pref(cid).hiddenChat){delete pref(cid).hiddenChat;saveState()}
  return m;
}

/* ================= pages stack ================= */
const stack=[];
function push(render,key,live){stack.push({render,key,live});drawPages()}
function pop(){stack.pop();drawPages()}
function closeAllPages(){stack.length=0;drawPages()}
function drawPages(){
  const el=$('#pages');
  if(!stack.length){el.hidden=true;el.innerHTML='';el.dataset.key='';return}
  const top=stack[stack.length-1];const same=el.dataset.key===top.key;const prevScroll=same?($('.pbody',el)?.scrollTop||0):0;
  const p=top.render();if(!p){pop();return}
  el.hidden=false;el.dataset.key=top.key;
  el.innerHTML=`<div class="page" style="${same?'animation:none':''}"><header class="phead"><button class="ib" data-a="back" aria-label="חזרה">${ic('back')}</button><h2>${p.title}</h2>${p.actions||''}</header><div class="pbody">${p.body}</div></div>`;
  const b=$('.pbody',el);if(prevScroll)b.scrollTop=prevScroll;
  p.after&&p.after(el);
}
const R=(icon,title,desc,act,attrs='',cls='')=>`<button class="srow ${cls}" data-a="${act}" ${attrs}>${icon?`<span class="sic">${ic(icon)}</span>`:''}<span class="stx"><b>${title}</b>${desc?`<small>${desc}</small>`:''}</span>${cls?'':ic('chev')}</button>`;
const GO=(icon,title,desc,p,extra='')=>R(icon,title,desc,'go',`data-p="${p}" ${extra}`);
const getP=path=>path.split('.').reduce((o,k)=>o?.[k],S());
function setP(path,v){const k=path.split('.');let o=S();for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
const TG=(title,desc,path,icon)=>`<label class="srow">${icon?`<span class="sic">${ic(icon)}</span>`:''}<span class="stx"><b>${title}</b>${desc?`<small>${desc}</small>`:''}</span><input type="checkbox" class="sw" data-set="${path}" ${getP(path)?'checked':''}></label>`;

function pgFaq(){const Q=[['איך מזמינים חברים?','שולחים להם את הקישור לאפליקציה (הגדרות ← הזמנת חברים). הם נרשמים, יוצרים פרופיל ומופיעים אצלך ברשימת האנשים.'],['איך מוצאים מישהו?','בחיפוש בלשונית צ׳אטים: לפי שם, @שם משתמש או מספר טלפון.'],['איך מתקשרים?','בצ׳אט עם החבר לוחצים על הטלפון (שיחה קולית) או על המצלמה (שיחת וידאו). אפשר גם מלשונית שיחות.'],['למה השיחה לא מתחברת?','ברשתות סלולריות מסוימות צריך שרת TURN. מוסיפים אותו בקובץ config.js לפי מדריך ההתקנה.'],['איך שולחים הודעה קולית?','כשתיבת ההודעה ריקה, כפתור השליחה הופך למיקרופון. לוחצים כדי להקליט ושולחים עם החץ.'],['איך מתקינים כאפליקציה?','הגדרות ← התקנה במסך הבית. באייפון: Safari ← שיתוף ← הוספה למסך הבית.'],['מה המשמעות של הווי?','וי אחד: נשלחה. שני וי: הגיעה. שני וי צהובים: נקראה.'],['למה לא קיבלתי התראה?','התראות מגיעות כש־ChatUP פתוחה (גם ברקע). כשהאפליקציה סגורה לגמרי ההודעות מחכות לך.']];return{title:'שאלות נפוצות',body:`<div class="faq">${Q.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`}}
function pgTerms(){return{title:'תנאים ופרטיות',body:`<div class="ptext" style="font-size:14.5px;color:var(--ink)"><p><b>שימוש.</b> אין לשלוח ב־ChatUP תוכן פוגעני, מטריד או לא חוקי.</p><p><b>מה נשמר.</b> הפרופיל, ההודעות, המדיה והסטטוסים נשמרים בשרת של האפליקציה. הודעות של צ׳אט נגישות רק לחברי הצ׳אט. השם, התמונה, שם המשתמש והסטטוסים גלויים לכל משתמשי ChatUP.</p><p><b>שיחות.</b> הקול והווידאו עוברים ישירות בין המכשירים ואינם נשמרים.</p><p><b>מחיקה.</b> אפשר למחוק את החשבון מהגדרות ← חשבון.</p></div>`}}

function pgInvite(){const me=prof(ME);const link=location.href.split('#')[0];const txt=`בוא/י לדבר איתי ב־ChatUP! נרשמים כאן: ${link} · שם המשתמש שלי: @${me.username||''}`;return{title:'הזמנת חברים',body:`<div class="hero">${ic('userplus',52)}<p>שלחו לחברים את הקישור. אחרי שהם נרשמים ויוצרים פרופיל, הם יופיעו כאן ואפשר לשלוח להם הודעות ולהתקשר.</p>${navigator.share?`<div class="acts"><button class="btn" data-a="shareInvite">שיתוף ההזמנה</button></div>`:''}</div><div class="plabel">הודעת ההזמנה</div><div class="copybox" dir="rtl"><code dir="rtl">${esc(txt)}</code><button class="ib" data-a="copyT" data-t="${esc(txt)}" aria-label="העתקה">${ic('copy')}</button></div><div class="plabel">כבר ב־ChatUP · ${Object.keys(P).length}</div>${Object.keys(P).map(u=>u===ME?'':personRow(u)).join('')}`}}

function qrSVG(seed){let h=0;for(const c of seed)h=(h*131+c.charCodeAt(0))>>>0;const rand=()=>(h=(h*1103515245+12345)>>>0)/4294967296;const N=25;let r='';const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#17152B"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#5B3FF5"/>`;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);if(!inF&&rand()>.52)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#17152B"/>`}return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges">${r}${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`}
function pgQR(){const me=prof(ME);return{title:'הכרטיס שלי',body:`<div class="hero">${meAv(72)}<h3>${esc(me.name||'')}</h3><p dir="ltr">@${esc(me.username||'')}</p></div><div class="qr">${qrSVG(ME)}</div><p class="ptext" style="text-align:center">חברים ב־ChatUP יכולים למצוא אותך בחיפוש לפי @${esc(me.username||'')}.</p>`}}
function pgLists(){const L=[['unread','לא נקראו'],['fav','מועדפים'],['groups','קבוצות']];return{title:'רשימות',body:`<p class="ptext">רשימות מופיעות כמסננים מעל רשימת הצ׳אטים.</p>${L.map(([k,l])=>`<button class="srow" data-a="useFilter" data-f="${k}"><span class="sic">${ic(k==='fav'?'heart':k==='groups'?'users':'unread')}</span><span class="stx"><b>${l}</b></span>${ic('chev')}</button>`).join('')}`}}
function pgArchived(){const L=sortChats(Object.values(CH).filter(c=>pref(c.id).archived&&!pref(c.id).locked));return{title:'בארכיון',body:`<p class="ptext">${S().keepArchived?'הצ׳אטים יישארו בארכיון גם כשתגיע הודעה חדשה.':'צ׳אטים יוצאו מהארכיון כשתגיע הודעה חדשה.'}</p>`+(L.length?L.map(chatRow).join(''):`<div class="empty"><b>אין צ׳אטים בארכיון</b></div>`)}}

function pgAddContact(){return{title:'איש קשר חדש',body:`<form id="acf"><div class="field"><label for="acq">שם משתמש או מספר טלפון</label><input class="inp" id="acq" dir="ltr" placeholder="@username או 050-1234567" required></div><div class="field"><label for="acn">שם לשמירה (לא חובה)</label><input class="inp" id="acn" maxlength="40" placeholder="איך יופיע/תופיע אצלך"></div><div class="btns"><button class="btn full">חיפוש ושמירה</button></div></form><p class="ptext">אפשר להוסיף רק אנשים שכבר נכנסו ל־ChatUP ויצרו פרופיל.</p>`,after:el=>$('#acf',el).addEventListener('submit',e=>{
  e.preventDefault();const q=$('#acq',el).value.trim().replace(/^@/,'').toLowerCase();const dq=digits(q);
  const u=Object.keys(P).find(x=>x!==ME&&((P[x].username||'')===q||(dq.length>=7&&digits(P[x].phone).endsWith(dq.slice(-9)))));
  if(!u){toast('לא נמצא משתמש. בדקו את שם המשתמש או המספר.');return}
  ST.contacts[u]={name:$('#acn',el).value.trim(),added:Date.now()};saveState();toast(`${pname(u)} נשמר/ה באנשי הקשר`);dm(u)})}}
function pgNewGroup(){const L=Object.keys(P).filter(u=>u!==ME).sort((a,b)=>pname(a).localeCompare(pname(b),'he'));return{title:'הוספת משתתפים',body:L.length?`<div id="ngl">${L.map(u=>`<label class="row">${av(pobj(u),44)}<span class="rm"><span class="rn">${esc(pname(u))}</span><span class="rp">${esc(prof(u).about||'')}</span></span><input type="checkbox" class="chk" value="${u}"></label>`).join('')}</div><div class="btns"><button class="btn full" data-a="ngNext">המשך</button></div>`:`<div class="empty"><b>עוד אין אנשים להוסיף</b>אפשר ליצור קבוצה ריקה ולשתף קישור הזמנה.</div><div class="btns"><button class="btn full" data-a="ngNext">יצירת קבוצה</button></div>`}}
async function createGroup(name,desc,photo,members,extra={}){
  const id='g'+rid(14);const now=Date.now();
  const d={type:'group',name,desc,photo:photo||null,color:colorFor(id),members:[ME,...members],admins:[ME],createdBy:ME,created:now,sent:{},seen:{},dlv:{},disappear:S().privacy.defaultTimer||0,...extra};
  await qw('chats/'+id,()=>db.doc('chats/'+id).set(d));CH[id]={id,...d};
  await sendMsg(id,{type:'system',ev:'created',name});
  return id;
}
function groupNameSheet(members,comm){
  let photo=null;
  openSheet(comm?'קבוצה חדשה בקהילה':'קבוצה חדשה',`<form id="gnf"><div class="hero" style="padding-top:4px"><button type="button" class="avedit" id="gph" aria-label="תמונת קבוצה"><span class="av" id="gpav" style="width:84px;height:84px;background:var(--accent-soft);color:var(--accent)">${ic('camera',30)}</span></button></div><div class="field"><label for="gn">שם הקבוצה</label><input class="inp" id="gn" maxlength="60" required></div><div class="field"><label for="gd">תיאור (לא חובה)</label><input class="inp" id="gd" maxlength="300"></div><p class="ptext">משתתפים: ${['את/ה',...members.map(pname)].map(esc).join(', ')}</p><div class="btns"><button class="btn full">יצירת הקבוצה</button></div></form>`,d=>{
    $('#gph',d).addEventListener('click',()=>pickFile('image/*',f=>readImage(f,240,.75,u=>{photo=u;$('#gpav',d).innerHTML=`<img src="${u}" alt="">`})));
    $('#gnf',d).addEventListener('submit',async e=>{e.preventDefault();const name=$('#gn',d).value.trim();if(!name)return;closeSheet(true);
      const id=await createGroup(name,$('#gd',d).value.trim(),photo,members,comm?{comm:comm.id}:{});

      openChat(id)});setTimeout(()=>$('#gn',d).focus(),60)});
}
function pgBroadcasts(){const L=Object.values(CH).filter(c=>c.type==='broadcast'&&c.createdBy===ME);return{title:'רשימות תפוצה',body:`<p class="ptext">הודעה לרשימת תפוצה מגיעה לכל נמען בצ׳אט פרטי איתך. הנמענים לא רואים זה את זה.</p>${R('plus','רשימת תפוצה חדשה','','newBroadcast','','accent')}${L.map(c=>`<button class="row" data-a="openChat" data-id="${c.id}">${av({kind:'broadcast',color:COLORS[3]},46)}<span class="rm"><span class="rn">${esc(c.name)}</span><span class="rp">${c.members.filter(x=>x!==ME).map(pshort).join(', ')}</span></span></button>`).join('')}`}}

let SV=null;
function openStatus(u){
  const owners=u===ME?[ME]:statusOwners();let oi=owners.indexOf(u);if(oi<0)return;
  const items=liveStatus(owners[oi]);let ii=u===ME?0:items.findIndex(s=>s.t>(ST.seenStatus[u]||0));if(ii<0)ii=0;
  SV={owners,oi,ii,pos:0,last:performance.now(),paused:false,raf:0};
  const el=document.createElement('div');el.className='viewer';el.id='viewer';$('#layers').appendChild(el);
  renderSV();svLoop();
}
function renderSV(){
  const el=$('#viewer');if(!el||!SV)return;const u=SV.owners[SV.oi];const items=liveStatus(u);const it=items[SV.ii];if(!it){closeSV();return}
  if(u!==ME&&it.t>(ST.seenStatus[u]||0)){ST.seenStatus[u]=it.t;saveState();qw(`sv/${u}/v/${ME}`,()=>db.doc(`sv/${u}/v/${ME}`).set({t:Date.now()}))}
  const o=u===ME?{...pobj(ME),name:'הסטטוס שלי'}:pobj(u);
  el.innerHTML=`<div class="vbars">${items.map((_,i)=>`<i><b style="width:${i<SV.ii?100:0}%" ${i===SV.ii?'id="svb"':''}></b></i>`).join('')}</div>
  <div class="vhead"><button class="ib" data-a="svClose" aria-label="סגירה">${ic('back')}</button>${av(o,40)}<span class="rm"><b>${esc(o.name)}</b><small>${dayLabel(it.t)} ב־${fmtTime(it.t)}</small></span>${u===ME?`<button class="ib" data-a="svDelete" aria-label="מחיקה">${ic('trash')}</button>`:''}</div>
  <div class="vbody" id="svbody">${it.type==='image'?`<img src="${esc(it.img)}" alt="">${it.cap?`<div class="vcap">${esc(it.cap)}</div>`:''}`:`<div class="vtext" style="background:${esc(it.bg)}">${esc(it.text)}</div>`}</div>
  <div class="vfoot">${u===ME?`<span class="views" id="svviews">${ic('eye')} טוען צפיות…</span>`:`<form id="svf" style="display:flex;gap:8px;flex:1"><input id="svr" placeholder="השבה…" aria-label="השבה לסטטוס"><button class="sendbtn" aria-label="שליחה"><span class="flip" style="display:grid">${ic('send')}</span></button></form><button class="ib" style="color:#fff" data-a="svLike" data-k="${u}" aria-label="אהבתי">${ic('heart')}</button>`}</div>`;
  if(u===ME)db.collection(`sv/${ME}/v`).get().then(s=>{const n=s.docs.filter(d=>(d.data().t||0)>=it.t).length;const v=$('#svviews');if(v)v.innerHTML=`${ic('eye')} ${n} צפיות`}).catch(()=>{});
  const body=$('#svbody');let down=0;
  body.addEventListener('pointerdown',()=>{down=performance.now();SV.paused=true});
  body.addEventListener('pointerup',e=>{const held=performance.now()-down>300;SV.paused=false;SV.last=performance.now();if(held)return;const r=body.getBoundingClientRect();const x=e.clientX-r.left;if(x<r.width*.35)svNext();else if(x>r.width*.65)svPrev()});
  const f=$('#svf');if(f){const i=$('#svr');i.addEventListener('focus',()=>SV.paused=true);i.addEventListener('blur',()=>{if(SV){SV.paused=false;SV.last=performance.now()}});
    f.addEventListener('submit',async e=>{e.preventDefault();const t=i.value.trim();if(!t)return;i.value='';i.blur();const c=await ensureDirect(u);if(c){sendMsg(c.id,{type:'text',text:t,status:true});toast('התשובה נשלחה')}})}
}
function svLoop(){if(!SV)return;const now=performance.now();if(!SV.paused)SV.pos+=(now-SV.last);SV.last=now;const b=$('#svb');if(b)b.style.width=Math.min(100,SV.pos/5000*100)+'%';if(SV.pos>=5000)svNext();if(SV)SV.raf=requestAnimationFrame(svLoop)}
function svNext(){const items=liveStatus(SV.owners[SV.oi]);SV.pos=0;if(SV.ii<items.length-1)SV.ii++;else if(SV.oi<SV.owners.length-1){SV.oi++;SV.ii=0}else{closeSV();return}renderSV()}
function svPrev(){SV.pos=0;if(SV.ii>0)SV.ii--;else if(SV.oi>0){SV.oi--;SV.ii=liveStatus(SV.owners[SV.oi]).length-1}renderSV()}
function closeSV(){if(SV)cancelAnimationFrame(SV.raf);SV=null;$('#viewer')?.remove();if(TAB==='updates')drawSide();drawNav()}
const SBG=['#5B3FF5','#D93D44','#14935F','#D9840F','#0B8FB3','#BE185D','#17152B'];

/* ================= media store (chunked in Firestore) ================= */
const Media={cache:{},
  async put(blob){
    if(blob.size>15*1048576)throw{code:'too-big'};
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob)});
    const id=rid(20),CHK=700000,n=Math.max(1,Math.ceil(b64.length/CHK));
    await db.doc('media/'+id).set({owner:ME,type:blob.type||'application/octet-stream',size:blob.size,n,created:Date.now()});
    for(let i=0;i<n;i++)await db.doc(`media/${id}/c/${i}`).set({owner:ME,d:b64.slice(i*CHK,(i+1)*CHK)});
    this.cache[id]=Promise.resolve(URL.createObjectURL(blob));
    return id;
  },
  url(id){
    if(!this.cache[id])this.cache[id]=(async()=>{
      const hs=await db.doc('media/'+id).get();const h=hs.data();if(!h)throw new Error('missing');
      const parts=[];for(let i=0;i<h.n;i++){const c=await db.doc(`media/${id}/c/${i}`).get();parts.push(c.data().d)}
      const bin=atob(parts.join(''));const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
      return URL.createObjectURL(new Blob([a],{type:h.type}));
    })();
    return this.cache[id];
  }};
function msrc(u){u=String(u||'');return u.startsWith('media:')?`data-media="${esc(u.slice(6))}"`:`src="${esc(u)}"`}
function hydrateMedia(root=document){
  $$('[data-media]:not([data-h])',root).forEach(el=>{el.dataset.h='1';Media.url(el.dataset.media).then(u=>{if(el.tagName==='A'){el.href=u;el.download=el.dataset.dl||'file'}else el.src=u}).catch(()=>{const s=document.createElement('span');s.className='del';s.textContent='הקובץ לא זמין';el.replaceWith(s)})});
}

let REC=null;
function pickMime(kind){const L=kind==='audio'?['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus']:['video/webm;codecs=vp8,opus','video/mp4','video/webm'];return L.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||''}
async function startRec(){
  if(!window.MediaRecorder||!navigator.mediaDevices){toast('הדפדפן הזה לא תומך בהקלטה');return}
  const cid=CUR;let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}catch(e){toast('צריך לאשר גישה למיקרופון כדי להקליט');return}
  const mime=pickMime('audio');const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:32000}:{});
  REC={mr,stream,chunks:[],start:Date.now(),cid,cancel:false};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)REC&&REC.chunks.push(e.data)};
  mr.onstop=async()=>{
    const r=REC;REC=null;clearInterval(r.iv);stream.getTracks().forEach(t=>t.stop());drawComposer();
    if(r.cancel||!r.chunks.length)return;
    const dur=Math.max(1,Math.round((Date.now()-r.start)/1000));
    const blob=new Blob(r.chunks,{type:mr.mimeType||mime||'audio/webm'});
    const url=await storeBlob(blob);if(url)sendMsg(r.cid,{type:'voice',url,dur});
  };

  if(row)row.innerHTML=`<div class="recbar"><button class="ib danger" data-a="recCancel" aria-label="ביטול הקלטה">${ic('trash')}</button><span class="recdot"></span><span id="rect">0:00</span><div class="recwave" id="recw"></div><span class="rechint">מקליט</span></div><button class="sendbtn" data-a="recSend" aria-label="שליחת הודעה קולית"><span class="flip" style="display:grid">${ic('send')}</span></button>`;
  REC.iv=setInterval(()=>{if(!REC)return;const s=(Date.now()-REC.start)/1000;const t=$('#rect');if(t)t.textContent=fmtDur(s);const w=$('#recw');if(w){const i=document.createElement('i');i.style.height=Math.round(15+Math.random()*85)+'%';w.prepend(i);if(w.children.length>80)w.lastChild.remove()}if(s>=300)stopRec(true)},180);
}

async function videoRecorder(cid){
  if(!window.MediaRecorder||!navigator.mediaDevices){toast('הדפדפן הזה לא תומך בהקלטת וידאו');return}

  try{stream=await get()}catch(e){toast('צריך לאשר גישה למצלמה ולמיקרופון');return}
  const el=document.createElement('div');el.className='viewer';el.id='viewer';

const ICE=()=>({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']},...(Array.isArray(CFG.turn)?CFG.turn:[])]});

async function startCall(uid,video){

function incoming(id,d){

function stars(n,seed,w=360,h=780,maxR=1.6,col='#fff'){const r=rng(seed);let s='';for(let i=0;i<n;i++){const x=(r()*w).toFixed(1),y=(r()*h).toFixed(1),rr=(r()*maxR+.3).toFixed(2),o=(r()*.7+.3).toFixed(2);s+=`<circle cx='${x}' cy='${y}' r='${rr}' fill='${col}' opacity='${o}'/>`}return s}

  return{img:svgu(`<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}' viewBox='0 0 ${size} ${size}'><rect width='100%' height='100%' fill='${bg}'/>${s}</svg>`),size:size+'px',tile:true};

function wpImage(id){const w=WPMAP[id];if(!w||w.css)return null;return WPCACHE[id]||(WPCACHE[id]=w.make())}

/* custom photo wallpapers */
const CW={};const CWload={};
function loadCustomWall(id){
  if(CW[id]||CWload[id])return;
  try{const c=localStorage.getItem('cw_'+id);if(c){CW[id]=c;return}}catch(e){}
  CWload[id]=db.doc(`data/users/${ME}/state/walls/${id}`).get().then(s=>{const d=s.data();if(d&&d.img){CW[id]=d.img;try{localStorage.setItem('cw_'+id,d.img)}catch(e){}paintAll()}}).catch(()=>{});
}
function addCustomWall(file,cid){
  readImage(file,1280,.74,async url=>{
    const id='p'+rid(10);
    try{await db.doc(`data/users/${ME}/state/walls/${id}`).set({img:url,t:Date.now()})}catch(e){dbErr(e);return}
    CW[id]=url;try{localStorage.setItem('cw_'+id,url)}catch(e){}
    ST.customWalls=[{id,t:Date.now()},...(ST.customWalls||[])].slice(0,8);
    setWallpaper('custom:'+id,cid);toast('הרקע עודכן');
  });
}
function removeCustomWall(id){
  ST.customWalls=(ST.customWalls||[]).filter(x=>x.id!==id);
  if(S().wallpaper==='custom:'+id)S().wallpaper='dots';
  Object.keys(ST.prefs).forEach(k=>{if(ST.prefs[k].wallpaper==='custom:'+id)ST.prefs[k].wallpaper=null});
  saveState();qw(`data/users/${ME}/state/walls/${id}`,()=>db.doc(`data/users/${ME}/state/walls/${id}`).delete());
  try{localStorage.removeItem('cw_'+id)}catch(e){}
  drawPages();if(CUR)buildChat();
}
function setWallpaper(w,cid){if(cid)pref(cid).wallpaper=w||null;else S().wallpaper=w;saveState();drawPages();if(CUR)buildChat()}

/* paint any element marked data-wp */
function paintWall(el){
  const id=el.dataset.wp||'dots';const dim=+(el.dataset.dim||0);
  [...el.classList].forEach(c=>{if(c.startsWith('wall-'))el.classList.remove(c)});
  const st=el.style;st.backgroundImage='';st.backgroundSize='';st.backgroundRepeat='';st.backgroundPosition='';st.backgroundColor='';
  st.boxShadow=dim?`inset 0 0 0 4000px rgba(0,0,0,${dim})`:'';
  if(id.startsWith('custom:')){const k=id.slice(7);const u=CW[k];if(!u){loadCustomWall(k);el.classList.add('wall-plain');return}
    st.backgroundColor='#000';st.backgroundImage=`url("${u}")`;st.backgroundSize='cover';st.backgroundPosition='center';st.backgroundRepeat='no-repeat';return}
  const w=WPMAP[id];
  if(!w||w.css){el.classList.add('wall-'+(w?id:'dots'));return}
  const im=wpImage(id);st.backgroundColor='#111';st.backgroundImage=im.img;
  st.backgroundSize=im.tile?im.size:'cover';st.backgroundRepeat=im.tile?'repeat':'no-repeat';st.backgroundPosition='center';
}
function paintAll(root=document){$$('[data-wp]',root).forEach(paintWall)}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType!==1)continue;if(n.dataset&&n.dataset.wp)paintWall(n);if(n.querySelectorAll)n.querySelectorAll('[data-wp]').forEach(paintWall)}}).observe(document.documentElement,{childList:true,subtree:true});
function wallAttr(wp,cid){
  const isCustom=String(wp).startsWith('custom:');
  const dim=S().wallDim!=null?S().wallDim:(isCustom?.25:0);
  const bs=(cid&&pref(cid).bstyle)||S().bstyle||'classic';
  return `class="msgs bs-${esc(bs)}" data-wp="${esc(wp||'dots')}" data-dim="${dim}"`;
}

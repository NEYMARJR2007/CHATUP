/* camera: always stop the old camera before opening another (many phones can't open two at once) */
async function openCamera(C){
  if(C.rawCam){try{C.rawCam.stop()}catch(e){}C.rawCam=null}
  let s;
  try{s=await navigator.mediaDevices.getUserMedia({video:camConstraints(C)})}
  catch(e){if(C.camDevice){C.camDevice=null;s=await navigator.mediaDevices.getUserMedia({video:camConstraints(C)})}else throw e}
  const t=s.getVideoTracks()[0];C.rawCam=t;
  const st=t.getSettings?t.getSettings():{};
  if(st.facingMode)C.facing=st.facingMode==='environment'?'environment':'user';
  if(st.deviceId)C.curDevice=st.deviceId;
  return t;
}
async function setVideoOut(C){
  const sender=C.vSender;if(!sender)return;
  let out=null;
  if(C.camOn&&C.rawCam){if(FX.active(C))out=FX.output(C);else{FX.stop(C);out=C.rawCam}}
  else FX.stop(C);
  C.outTrack=out;
  try{await sender.replaceTrack(out)}catch(e){console.warn('replaceTrack',e)}
  C.preview=out?new MediaStream([out]):null;
  bindCallMedia();
}
function signalCam(C){if(C.ref)C.ref.update({cam:{[ME]:!!C.camOn}}).catch(()=>{})}
function newPC(C){
  const pc=new RTCPeerConnection(iceCfg());
  pc.ontrack=e=>{if(CALL!==C)return;const t=e.track;if(!C.remote.getTracks().includes(t))C.remote.addTrack(t);
    if(t.kind==='video'){t.onunmute=()=>{if(CALL===C){C.remoteFlow=true;updRemoteVid(C)}};t.onmute=()=>{if(CALL===C){C.remoteFlow=false;updRemoteVid(C)}};C.remoteFlow=!t.muted}
    bindCallMedia();updRemoteVid(C)};
  pc.onconnectionstatechange=()=>{if(CALL!==C)return;const s=pc.connectionState;
    if(s==='connected'){C.netWarn=false;netOk(C);if(C.state!=='live'){C.state='live';C.start=C.start||Date.now();clearTimeout(C.to);renderCall()}}
    else if(s==='disconnected'||s==='failed')netTrouble(C,s)};
  return pc;
}
function updRemoteVid(C){const v=!!(C.peerCam&&C.remote.getVideoTracks().length);if(v!==C.remoteVid){C.remoteVid=v;if(v)C.video=true;renderCall()}}
function onCallDoc(C,d){
  if(!d)return;const pc=!!(d.cam&&d.cam[C.peer]);
  if(pc!==C.peerCam){C.peerCam=pc;updRemoteVid(C)}
}
function addRemoteCand(C,c){if(CALL!==C)return;if(C.pc&&C.pc.remoteDescription)C.pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});else C.pendIn.push(c)}
function flushIn(C){C.pendIn.splice(0).forEach(c=>C.pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{}))}
function newCallObj(o){return{start:0,mute:false,camOn:false,facing:'user',remote:new MediaStream(),pendIn:[],pendOut:[],ready:false,unsubs:[],fx:{filter:'none',sticker:'none',bg:'none'},fxTab:'filter',peerCam:false,remoteVid:false,...o}}
async function startCall(uid,video){
  if(CALL){toast('כבר יש שיחה פעילה');return}
  if(!uid||uid===ME)return;
  if(isBlocked(uid)){toast('צריך לבטל את החסימה כדי להתקשר');return}
  if(!window.RTCPeerConnection||!navigator.mediaDevices){toast('הדפדפן הזה לא תומך בשיחות');return}
  const id='c'+Date.now().toString(36)+rid(6),ref=db.doc('calls/'+id);
  const C=CALL=newCallObj({id,ref,peer:uid,video:!!video,out:true,state:'calling',camOn:!!video});
  renderCall();
  let mic;try{mic=await getMicStream();if(video)await openCamera(C)}catch(e){mediaErr(e,video);if(mic)mic.getTracks().forEach(t=>t.stop());killCall(C);return}
  if(CALL!==C){mic.getTracks().forEach(t=>t.stop());C.rawCam&&C.rawCam.stop();return}
  C.local=mic;C.pc=newPC(C);
  mic.getAudioTracks().forEach(t=>C.pc.addTrack(t,mic));
  C.vSender=C.pc.addTransceiver('video',{direction:'sendrecv'}).sender;
  await setVideoOut(C);
  C.pc.onicecandidate=e=>{if(!e.candidate||CALL!==C)return;const j=e.candidate.toJSON();if(C.ready)db.collection(`calls/${id}/a`).add(j).catch(()=>{});else C.pendOut.push(j)};
  const offer=await C.pc.createOffer();await C.pc.setLocalDescription(offer);
  try{await ref.set({from:ME,to:uid,video:!!video,state:'ringing',created:Date.now(),cam:{[ME]:!!video},offer:{type:offer.type,sdp:offer.sdp}})}catch(e){dbErr(e);killCall(C);return}
  if(CALL!==C){ref.update({state:'missed'}).catch(()=>{});return}
  C.ready=true;pushCall(C);C.pendOut.splice(0).forEach(j=>db.collection(`calls/${id}/a`).add(j).catch(()=>{}));
  presWrite();
  C.unsubs.push(ref.onSnapshot(async s=>{const d=s.data();if(!d||CALL!==C)return;
    if(d.answer&&!C.answered){C.answered=true;C.state='connecting';renderCall();try{await C.pc.setRemoteDescription(d.answer);flushIn(C)}catch(e){console.warn(e)}}
    onCallDoc(C,d);
    if(['ended','declined','missed','busy'].includes(d.state))endCall(d.state,true)},()=>{}));
  C.unsubs.push(db.collection(`calls/${id}/b`).onSnapshot(s=>s.docChanges().forEach(ch=>{if(ch.type==='added')addRemoteCand(C,ch.doc.data())}),()=>{}));
  C.to=setTimeout(()=>{if(CALL===C&&!C.answered)endCall('missed')},45000);
}
function listenIncoming(){
  db.collection('calls').where('to','==',ME).where('state','==','ringing').onSnapshot(s=>{
    s.docChanges().forEach(ch=>{if(ch.type!=='added')return;const d=ch.doc.data(),id=ch.doc.id,ref=db.doc('calls/'+id);
      if(Date.now()-(d.created||0)>40000)return;
      if(isBlocked(d.from)){ref.update({state:'declined'}).catch(()=>{});return}
      if(CALL){if(CALL.id!==id){ref.update({state:'busy'}).catch(()=>{});logCall({id,peer:d.from,dir:'missed',video:!!d.video,t:Date.now(),dur:0})}return}
      incoming(id,d)})
  },dbErr);
}
function incoming(id,d){
  const ref=db.doc('calls/'+id);
  const C=CALL=newCallObj({id,ref,peer:d.from,video:!!d.video,out:false,state:'ringing-in',offer:d.offer,peerCam:!!(d.cam&&d.cam[d.from])});
  renderCall();ringStart();
  if(document.hidden)sysNotify(pname(d.from),d.video?'שיחת וידאו נכנסת':'שיחה קולית נכנסת',{call:id},{requireInteraction:true});
  C.unsubs.push(ref.onSnapshot(s=>{const x=s.data();if(!x||CALL!==C)return;onCallDoc(C,x);if(['ended','missed','declined'].includes(x.state))endCall(C.answered?'ended':'missed',true)},()=>{}));
  C.to=setTimeout(()=>{if(CALL===C&&!C.answered)endCall('missed',true)},45000);
}
async function answerCall(withVideo){
  const C=CALL;if(!C||C.out||C.answered)return;
  ringStop();C.answered=true;C.state='connecting';C.camOn=C.video&&withVideo!==false;clearTimeout(C.to);renderCall();
  let mic;try{mic=await getMicStream();if(C.camOn)await openCamera(C)}catch(e){mediaErr(e,C.camOn);if(mic)mic.getTracks().forEach(t=>t.stop());endCall('declined');return}
  if(CALL!==C){mic.getTracks().forEach(t=>t.stop());C.rawCam&&C.rawCam.stop();return}
  C.local=mic;C.pc=newPC(C);
  C.pc.onicecandidate=e=>{if(e.candidate&&CALL===C)db.collection(`calls/${C.id}/b`).add(e.candidate.toJSON()).catch(()=>{})};
  try{
    await C.pc.setRemoteDescription(C.offer);flushIn(C);
    const ta=C.pc.getTransceivers().find(t=>t.receiver.track&&t.receiver.track.kind==='audio');
    if(ta){ta.direction='sendrecv';await ta.sender.replaceTrack(mic.getAudioTracks()[0])}else mic.getAudioTracks().forEach(t=>C.pc.addTrack(t,mic));
    let tv=C.pc.getTransceivers().find(t=>t.receiver.track&&t.receiver.track.kind==='video');
    if(tv)tv.direction='sendrecv';else tv=C.pc.addTransceiver('video',{direction:'sendrecv'});
    C.vSender=tv.sender;await setVideoOut(C);
    const ans=await C.pc.createAnswer();await C.pc.setLocalDescription(ans);
    await C.ref.update({answer:{type:ans.type,sdp:ans.sdp},state:'accepted',startedAt:Date.now(),cam:{[ME]:!!C.camOn}});
  }catch(e){console.warn(e);toast('לא הצלחנו לענות לשיחה');endCall('ended');return}
  C.unsubs.push(db.collection(`calls/${C.id}/a`).onSnapshot(s=>s.docChanges().forEach(ch=>{if(ch.type==='added')addRemoteCand(C,ch.doc.data())}),()=>{}));
  C.to=setTimeout(()=>{if(CALL===C&&C.state!=='live'){toast('לא הצלחנו לחבר את השיחה. בדקו את החיבור לאינטרנט ונסו שוב.');endCall('failed')}},45000);
  presWrite();
}
function killCall(C){if(CALL===C)CALL=null;ringStop();FX.stop(C);$('#call')?.remove()}
function endCall(reason,remote){
  const C=CALL;if(!C||C.ending)return;C.ending=true;ringStop();clearTimeout(C.to);clearInterval(C.iv);
  const dur=C.start?Math.round((Date.now()-C.start)/1000):0;
  if(!remote&&C.ref){const st=C.answered?'ended':(C.out?'missed':'declined');C.ref.update({state:st,ended:Date.now()}).catch(()=>{})}
  FX.stop(C);
  try{C.local&&C.local.getTracks().forEach(t=>t.stop())}catch(e){}
  try{C.rawCam&&C.rawCam.stop()}catch(e){}
  try{C.pc&&C.pc.close()}catch(e){}
  C.unsubs.forEach(u=>{try{u()}catch(e){}});
  CALL=null;$('#call')?.remove();presWrite();
  const dir=C.out?'out':(C.answered?'in':'missed');
  logCall({id:C.id,peer:C.peer,dir,video:C.video,t:Date.now(),dur});
  if(C.out&&C.ready)ensureDirect(C.peer).then(c=>{if(c)sendMsg(c.id,{type:'call',video:C.video,dur,missed:dur?undefined:true})});
  const T={declined:'השיחה נדחתה',busy:'המשתמש/ת בשיחה אחרת',missed:C.out?'אין מענה':'שיחה שלא נענתה',failed:'השיחה נותקה'};
  toast(dur?'השיחה הסתיימה · '+fmtDur(dur):(T[reason]||'השיחה הסתיימה'));
  if(TAB==='calls')drawSide();drawNav();
}
function logCall(e){const {id,...d}=e;qw(`data/users/${ME}/state/log/${id}`,()=>db.doc(`data/users/${ME}/state/log/${id}`).set(d))}
function subscribeLog(){db.collection(`data/users/${ME}/state/log`).orderBy('t','desc').limit(80).onSnapshot(s=>{LOG=s.docs.map(d=>({id:d.id,...d.data()}));if(TAB==='calls')drawSide();drawNav()},dbErr)}
/* ---------- controls ---------- */
function callToggleMute(){const C=CALL;if(!C)return;C.mute=!C.mute;C.local&&C.local.getAudioTracks().forEach(t=>t.enabled=!C.mute);if(C.ref)C.ref.update({mic:{[ME]:!C.mute}}).catch(()=>{});renderCall()}
async function callToggleCam(){
  const C=CALL;if(!C||!C.pc)return;
  if(C.camOn){C.camOn=false;try{C.rawCam&&C.rawCam.stop()}catch(e){}C.rawCam=null;C.fxOpen=false;await setVideoOut(C);signalCam(C);renderCall();return}
  try{await openCamera(C)}catch(e){mediaErr(e,true);return}
  C.camOn=true;C.video=true;await setVideoOut(C);signalCam(C);renderCall();
}
async function flipCamera(){
  const C=CALL;if(!C||!C.camOn||!C.pc)return;
  const prevFacing=C.facing,prevDev=C.curDevice;
  try{
    let devs=[];try{devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput')}catch(e){}
    if(devs.length>2&&prevDev){
      const want=prevFacing==='user'?/back|rear|environment|אחור/i:/front|user|face|קדמ/i;
      const cand=devs.filter(d=>d.deviceId!==prevDev);
      const pick=cand.find(d=>want.test(d.label))||cand[0];
      C.camDevice=pick.deviceId;C.facing=prevFacing==='user'?'environment':'user';
    } else if(devs.length===2&&prevDev&&devs.every(d=>d.deviceId)){
      C.camDevice=(devs.find(d=>d.deviceId!==prevDev)||devs[0]).deviceId;C.facing=prevFacing==='user'?'environment':'user';
    } else {C.camDevice=null;C.facing=prevFacing==='user'?'environment':'user'}
    await openCamera(C);
    if(C.curDevice&&prevDev&&C.curDevice===prevDev&&!C.camDevice){C.facing=prevFacing==='user'?'environment':'user'}
    await setVideoOut(C);renderCall();
  }catch(e){console.warn(e);toast('לא הצלחנו להחליף מצלמה');C.camDevice=null;C.facing=prevFacing;try{await openCamera(C);await setVideoOut(C)}catch(x){}renderCall()}
}
/* ---------- screen ---------- */
function renderCall(){
  const C=CALL;if(!C)return;let el=$('#call');
  if(!el){el=document.createElement('div');el.className='call';el.id='call';$('#layers').appendChild(el)}
  const p=pobj(C.peer),live=C.state==='live',rv=live&&C.remoteVid,vidCall=C.camOn||C.remoteVid||(C.video&&!live);
  el.style.setProperty('--cc',p.color);el.classList.toggle('isvid',!!rv);
  el.innerHTML=`<video id="rv" class="rv" autoplay playsinline ${rv?'':'hidden'}></video><audio id="ra" autoplay></audio>
  <div class="ctop"><span class="clabel">${ic('lock',13)} ${vidCall?'שיחת וידאו':'שיחה קולית'} · SpicyyChat</span><h2>${esc(p.name)}</h2><span class="cstat" id="cstat"></span></div>
  <div class="cav ${live?'':'ring'}" ${rv?'hidden':''}>${av(p,128)}</div>
  ${C.state!=='ringing-in'&&C.camOn?`<video id="lv" class="lv ${C.facing==='user'?'mir':''}" autoplay playsinline muted></video>`:''}
  <div class="cbottom">${C.fxOpen&&C.camOn?FX.panel(C):''}
  <div class="cctl">${C.state==='ringing-in'?`<button class="end" data-a="callDecline" aria-label="דחייה">${ic('phoneoff')}</button>${C.video?`<button class="ans2" data-a="callAnswerAudio" aria-label="מענה בקול בלבד">${ic('phone')}</button>`:''}<button class="ans" data-a="callAnswer" aria-label="מענה">${ic(C.video?'video':'phone')}</button>`:`
    <button class="${C.mute?'on':''}" data-a="callT" data-k="mute" aria-label="${C.mute?'ביטול השתקה':'השתקה'}">${ic(C.mute?'micoff':'mic')}</button>
    <button class="${C.camOn?'on':''}" data-a="callT" data-k="cam" aria-label="${C.camOn?'כיבוי מצלמה':'הפעלת מצלמה'}">${ic(C.camOn?'video':'videooff')}</button>
    ${C.camOn?`<button data-a="callFlip" aria-label="החלפת מצלמה">${ic('refresh')}</button><button class="${C.fxOpen?'on':''}" data-a="callFx" aria-label="אפקטים ורקעים">${ic('sparkle')}</button>`:''}
    <button class="end" data-a="callEnd" aria-label="ניתוק">${ic('phoneoff')}</button>`}</div></div>`;
  bindCallMedia();renderCallStatus();
  clearInterval(C.iv);C.iv=setInterval(renderCallStatus,500);
}
function renderCallStatus(){const C=CALL,s=$('#cstat');if(!C||!s)return;s.textContent=({calling:'מחייג/ת…','ringing-in':C.video?'שיחת וידאו נכנסת…':'שיחה קולית נכנסת…',connecting:'מתחבר…',live:fmtDur((Date.now()-C.start)/1000)+(C.netWarn?' · חיבור חלש':'')})[C.state]||''}
function bindCallMedia(){
  const C=CALL;if(!C)return;
  const rv=$('#rv'),ra=$('#ra'),lv=$('#lv');
  if(rv&&rv.srcObject!==C.remote)rv.srcObject=C.remote;
  if(ra&&ra.srcObject!==C.remote)ra.srcObject=C.remote;
  if(rv)rv.muted=true;
  if(lv&&C.preview&&lv.srcObject!==C.preview)lv.srcObject=C.preview;
  [rv,ra,lv].forEach(x=>x&&x.play&&x.play().catch(()=>{}));
}
window.addEventListener('pagehide',()=>{if(CALL)endCall('ended')});

const AUTH_ERR={'auth/invalid-credential':'האימייל או הסיסמה שגויים','auth/wrong-password':'האימייל או הסיסמה שגויים','auth/user-not-found':'לא נמצא חשבון עם האימייל הזה','auth/invalid-email':'כתובת האימייל לא תקינה','auth/email-already-in-use':'כבר קיים חשבון עם האימייל הזה. נסו להתחבר.','auth/weak-password':'הסיסמה צריכה לכלול לפחות 6 תווים','auth/too-many-requests':'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות.','auth/network-request-failed':'אין חיבור לאינטרנט','auth/unauthorized-domain':'הכתובת של האתר לא מאושרת ב־Firebase. הוסיפו אותה ב־Authentication ← Settings ← Authorized domains.','auth/operation-not-allowed':'שיטת הכניסה הזו לא הופעלה ב־Firebase. הפעילו אותה ב־Authentication ← Sign-in method.','auth/requires-recent-login':'מטעמי אבטחה צריך להתחבר מחדש ואז לנסות שוב.'};
function authErr(e){if(!e||['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code))return;toast(AUTH_ERR[e.code]||'הפעולה נכשלה. נסו שוב.')}
function authScreen(){
  gate('none');$('#auth')?.remove();
  const el=document.createElement('div');el.className='onb';el.id='auth';let mode='login';
  const draw=()=>{
    el.innerHTML=`<div class="onbc"><div class="logo">Spicyy<b>Chat</b></div><p class="tag">${mode==='login'?'כניסה לחשבון':mode==='signup'?'יצירת חשבון חדש':'איפוס סיסמה'}</p>
    ${mode!=='reset'?`<div class="btns"><button class="btn ghost full" id="gbtn" type="button">כניסה עם Google</button></div><p class="small" style="padding-top:0">או עם אימייל וסיסמה</p>`:''}
    <form id="af"><div class="field"><label for="ae">אימייל</label><input class="inp" id="ae" type="email" dir="ltr" required autocomplete="email"></div>
    ${mode!=='reset'?`<div class="field"><label for="ap">סיסמה</label><input class="inp" id="ap" type="password" dir="ltr" required minlength="6" autocomplete="${mode==='login'?'current-password':'new-password'}"></div>`:''}
    <div class="btns"><button class="btn full" id="asub">${mode==='login'?'כניסה':mode==='signup'?'הרשמה':'שליחת קישור לאיפוס'}</button></div></form>
    <p class="small">${mode==='login'?'<button class="lnk" data-m="signup" type="button">אין לך חשבון? הרשמה</button> · <button class="lnk" data-m="reset" type="button">שכחתי סיסמה</button>':'<button class="lnk" data-m="login" type="button">יש לך כבר חשבון? כניסה</button>'}</p></div>`;
    $$('[data-m]',el).forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw()});
    const g=$('#gbtn',el);if(g)g.onclick=async()=>{const p=new firebase.auth.GoogleAuthProvider();try{await fauth.signInWithPopup(p)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code))fauth.signInWithRedirect(p);else authErr(e)}};
    $('#af',el).addEventListener('submit',async e=>{e.preventDefault();const em=$('#ae',el).value.trim(),pw=$('#ap',el)?.value||'';const b=$('#asub',el);b.disabled=true;
      try{
        if(mode==='login')await fauth.signInWithEmailAndPassword(em,pw);
        else if(mode==='signup')await fauth.createUserWithEmailAndPassword(em,pw);
        else{await fauth.sendPasswordResetEmail(em);toast('שלחנו קישור לאיפוס הסיסמה לאימייל שלך');mode='login';draw();return}
      }catch(err){authErr(err)}finally{b.disabled=false}});
  };
  draw();$('#layers').appendChild(el);
}


/* ================= wallpapers catalog ================= */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const svgu=s=>`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(s)}")`;
const SC=(inner,defs='')=>`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 360 780' preserveAspectRatio='xMidYMid slice'><defs>${defs}</defs>${inner}</svg>`;
function stars(n,seed,w=360,h=780,maxR=1.6,col='#fff'){const r=rng(seed);let s='';for(let i=0;i<n;i++){const x=(r()*w).toFixed(1),y=(r()*h).toFixed(1),rr=(r()*maxR+.3).toFixed(2),o=(r()*.7+.3).toFixed(2);s+=`<circle cx='${x}' cy='${y}' r='${rr}' fill='${col}' opacity='${o}'/>`}return s}
function emojiTile(list,bg,size=150,op=.22,seed=7){
  const r=rng(seed);let s='';const g=3,step=size/g;let k=0;
  for(let y=0;y<g;y++)for(let x=0;x<g;x++){const e=list[k++%list.length];const cx=(x+.5)*step+(y%2?step*.25:0),cy=(y+.5)*step;const rot=Math.round(r()*50-25);const fs=(step*(.45+r()*.15)).toFixed(0);s+=`<text x='${cx.toFixed(0)}' y='${cy.toFixed(0)}' font-size='${fs}' text-anchor='middle' dominant-baseline='central' opacity='${op}' transform='rotate(${rot} ${cx.toFixed(0)} ${cy.toFixed(0)})'>${e}</text>`}
  return{img:svgu(`<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}' viewBox='0 0 ${size} ${size}'><rect width='100%' height='100%' fill='${bg}'/>${s}</svg>`),size:size+'px',tile:true};
}

/* paint any element marked data-wp */
function paintWall(el){
  const id=el.dataset.wp||'dots';const dim=+(el.dataset.dim||0);
  [...el.classList].forEach(c=>{if(c.startsWith('wall-'))el.classList.remove(c)});
  const st=el.style;st.backgroundImage='';st.backgroundSize='';st.backgroundRepeat='';st.backgroundPosition='';st.backgroundColor='';
  st.boxShadow=dim?`inset 0 0 0 4000px rgba(0,0,0,${dim})`:'';
  if(id.startsWith('custom:')){const k=id.slice(7);const u=CW[k];if(!u){loadCustomWall(k);el.classList.add('wall-plain');return}
    st.backgroundColor='#000';st.backgroundImage=`url("${u}")`;st.backgroundSize='cover';st.backgroundPosition='center';st.backgroundRepeat='no-repeat';return}
  const w=WPMAP[id];
  if(!w||w.css){el.classList.add('wall-'+(w?id:'dots'));return}
  const im=wpImage(id);st.backgroundColor='#111';st.backgroundImage=im.img;
  st.backgroundSize=im.tile?im.size:'cover';st.backgroundRepeat=im.tile?'repeat':'no-repeat';st.backgroundPosition='center';
}
function paintAll(root=document){$$('[data-wp]',root).forEach(paintWall)}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType!==1)continue;if(n.dataset&&n.dataset.wp)paintWall(n);if(n.querySelectorAll)n.querySelectorAll('[data-wp]').forEach(paintWall)}}).observe(document.documentElement,{childList:true,subtree:true});
function wallAttr(wp,cid){

}

/* ================= back button: one history entry per open screen ================= */
/* Chrome skips history entries that were added without a tap, so we push an entry
   while the user's tap is still active (when a screen opens) and never re-push after "back". */
const NAV={depth:0,ignore:0};
const mobileLayout=()=>!matchMedia('(min-width:900px)').matches;
function navLayers(){
  if($('#lockscr')||$('#onb')||$('#auth')||$('#gate'))return [];
  const L=[];
  if(TAB!=='chats')L.push('tab');
  if(CUR&&mobileLayout())L.push('chat');
  if(chatSearch!==null&&CUR)L.push('csearch');
  for(let i=0;i<stack.length;i++)L.push('page');
  if($('#viewer'))L.push('viewer');
  if($('#call'))L.push('call');
  if($('#sheet'))L.push('sheet');
  if($('#menu'))L.push('menu');
  return L;
}
function closeTopLayer(kind){
  switch(kind){
    case 'menu':closeMenu();break;
    case 'sheet':closeSheet();break;
    case 'viewer':if(SV)closeSV();else $('#viewer')?.remove();break;
    case 'page':pop();break;
    case 'chat':closeChat();break;
    case 'csearch':chatSearch=null;drawCSearch();drawMsgs(true);break;
    case 'tab':setTab('chats');break;
    case 'call':if(CALL&&CALL.fxOpen){CALL.fxOpen=false;renderCall()}else toast('השיחה עדיין פעילה. לניתוק לחצו על הכפתור האדום.');break;
  }
}
function syncNav(){
  const want=navLayers().length;
  if(want>NAV.depth){
    for(let i=NAV.depth;i<want;i++){try{history.pushState({chatup:i+1},'')}catch(e){}}
    NAV.depth=want;
  } else if(want<NAV.depth){
    const n=NAV.depth-want;NAV.depth=want;NAV.ignore++;try{history.go(-n)}catch(e){NAV.ignore--}
  }
}
window.addEventListener('popstate',()=>{
  if(NAV.ignore>0){NAV.ignore--;return}
  NAV.depth=Math.max(0,NAV.depth-1);
  const L=navLayers();const top=L[L.length-1];
  if(top)closeTopLayer(top);
  requestAnimationFrame(()=>{
    const want=navLayers().length;
    if(want<NAV.depth){const n=NAV.depth-want;NAV.depth=want;NAV.ignore++;try{history.go(-n)}catch(e){NAV.ignore--}}
    else if(want>NAV.depth){for(let i=NAV.depth;i<want;i++){try{history.pushState({chatup:i+1},'')}catch(e){}}NAV.depth=want}
  });
});
let navQ=0;
new MutationObserver(()=>{if(navQ)return;navQ=requestAnimationFrame(()=>{navQ=0;syncNav()})}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','hidden']});

  let step='num',cc='972',num='',e164='',vid=null,timer=0,left=0,busy=false;
  const draw=()=>{
    clearInterval(timer);
    host.innerHTML=step==='num'?`<p class="tag">${o.sub||'הקלידו את מספר הטלפון שלכם. נשלח אליכם קוד ב־SMS.'}</p>
      <form id="phf" class="phf"><div class="field"><label for="phc">מדינה</label><select class="inp" id="phc">${COUNTRIES.map(([c,n])=>`<option value="${c}" ${c===cc?'selected':''}>${n} (+${c})</option>`).join('')}</select></div>
      <div class="field"><label for="phn">מספר טלפון</label><div class="phrow"><span class="phcc" dir="ltr">+${cc}</span><input class="inp" id="phn" type="tel" dir="ltr" inputmode="tel" autocomplete="tel-national" placeholder="050-123-4567" value="${esc(num)}" required></div></div>
      <div class="btns"><button class="btn full" id="phgo">${o.btn||'שליחת קוד'}</button></div></form>${o.foot||''}`
    :`<p class="tag">שלחנו קוד בן 6 ספרות ב־SMS למספר<br><b dir="ltr">${esc(prettyPhone(e164))}</b></p>
      <form id="pcf" class="phf"><div class="field"><input class="inp otp" id="pco" type="text" dir="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="------" aria-label="הקוד מה־SMS" required></div>
      <div class="btns"><button class="btn full" id="pcgo">אישור</button></div></form>
      <p class="small"><button class="lnk" type="button" id="pcre" disabled>שליחה מחדש</button> · <button class="lnk" type="button" id="pcback">שינוי המספר</button></p>${o.foot||''}`;
    if(step==='num'){
      const sel=$('#phc',host),inp=$('#phn',host);
      sel.onchange=()=>{cc=sel.value;$('.phcc',host).textContent='+'+cc};
      $('#phf',host).onsubmit=async e=>{e.preventDefault();if(busy)return;num=inp.value;e164=toE164(cc,num);
        if(!/^\+\d{8,15}$/.test(e164)){toast('מספר הטלפון לא תקין');inp.focus();return}
        const b=$('#phgo',host);busy=true;b.disabled=true;b.textContent='שולח קוד…';
        try{vid=await sendSmsCode(e164);step='code';left=60;draw()}catch(err){console.warn(err);authErr(err);b.disabled=false;b.textContent=o.btn||'שליחת קוד'}finally{busy=false}};
      setTimeout(()=>inp.focus(),60);
    }else{
      const inp=$('#pco',host),re=$('#pcre',host);
      const tick=()=>{left--;if(left<=0){clearInterval(timer);re.disabled=false;re.textContent='שליחה מחדש'}else re.textContent=`שליחה מחדש (${left})`};tick();timer=setInterval(tick,1000);
      re.onclick=async()=>{re.disabled=true;try{vid=await sendSmsCode(e164);toast('נשלח קוד חדש');left=60;tick();clearInterval(timer);timer=setInterval(tick,1000)}catch(err){authErr(err);re.disabled=false}};
      $('#pcback',host).onclick=()=>{step='num';draw()};
      const submit=async()=>{const code=digits(inp.value);if(code.length!==6||busy)return;busy=true;const b=$('#pcgo',host);b.disabled=true;b.textContent='מאמת…';
        try{const cred=firebase.auth.PhoneAuthProvider.credential(vid,code);await o.onCred(cred,e164);clearInterval(timer)}
        catch(err){console.warn(err);authErr(err);inp.value='';inp.focus();b.disabled=false;b.textContent='אישור'}finally{busy=false}};
      inp.addEventListener('input',()=>{inp.value=digits(inp.value).slice(0,6);if(inp.value.length===6)submit()});
      $('#pcf',host).onsubmit=e=>{e.preventDefault();submit()};
      setTimeout(()=>inp.focus(),60);
    }
  };
  draw();
  return{stop:()=>clearInterval(timer)};
}

/* ================= calls v2: relay server (TURN), auto-reconnect, new call screen ================= */
IC.chevdown='<path d="M6 9l6 6 6-6"/>';
var TURN_DYN=null;
let TURN_EXP=0,TURN_P=null;
try{const j=JSON.parse(localStorage.getItem('spicyy-turn')||'null');if(j&&j.exp>Date.now()+3600e3&&Array.isArray(j.s)){TURN_DYN=j.s;TURN_EXP=j.exp}}catch(e){}
function ensureTurn(){
  if(TURN_DYN&&TURN_EXP>Date.now()+3600e3)return Promise.resolve(TURN_DYN);
  if(TURN_P)return TURN_P;
  if(!pushConfigured()||!fauth||!fauth.currentUser)return Promise.resolve(null);
  TURN_P=(async()=>{
    try{
      const t=await fauth.currentUser.getIdToken();
      const r=await fetch(pushUrl()+'/turn',{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:'{}'});
      if(!r.ok)return null;const j=await r.json();
      const L=(j.iceServers||[]).map(x=>({...x,urls:[].concat(x.urls||[]).filter(u=>!/:53(\?|$)/.test(String(u)))})).filter(x=>x.urls.length);
      if(!L.some(x=>x.urls.some(u=>/^turns?:/.test(u))))return null;
      TURN_DYN=L;TURN_EXP=Date.now()+Math.max(3600,(j.ttl||86400))*1000;
      try{localStorage.setItem('spicyy-turn',JSON.stringify({s:L,exp:TURN_EXP}))}catch(e){}
      return L;
    }catch(e){console.warn('turn',e);return null}finally{TURN_P=null}
  })();
  return TURN_P;
}

/* ----- reconnect when the network drops (the caller leads an ICE restart) ----- */
function netOk(C){clearTimeout(C.rfail);clearTimeout(C.rt);C.rfail=0;C.restarting=false;C.recon=false}
function netTrouble(C,s){
  C.netWarn=true;C.recon=true;renderCallStatus();if(!C.pc)return;
  if(s==='disconnected'){clearTimeout(C.rt);C.rt=setTimeout(()=>{if(CALL===C&&C.pc&&C.pc.connectionState!=='connected')iceRestart(C)},3500)}
  else iceRestart(C);
  if(!C.rfail)C.rfail=setTimeout(()=>{if(CALL===C&&C.pc&&C.pc.connectionState!=='connected'){toast('החיבור לשיחה נותק');endCall('failed')}},30000);
}
async function iceRestart(C){
  if(!C.out||C.restarting||CALL!==C||!C.pc||(C.rn||0)>=5)return;
  C.restarting=true;C.rn=(C.rn||0)+1;
  try{
    await waitMax(ensureTurn(),2000);try{C.pc.setConfiguration(iceCfg())}catch(e){}
    const o=await C.pc.createOffer({iceRestart:true});await C.pc.setLocalDescription(o);
    await C.ref.update({reoffer:{type:o.type,sdp:o.sdp,n:C.rn}});
  }catch(e){console.warn('ice restart',e);C.restarting=false}
}
const __ocd11=onCallDoc;

  const pm=!!(d.mic&&d.mic[C.peer]===false);if(pm!==!!C.peerMute){C.peerMute=pm;renderCall()}
  if(!C.out&&d.reoffer&&C.pc&&d.reoffer.n>(C.lastRe||0)){
    C.lastRe=d.reoffer.n;
    (async()=>{try{try{C.pc.setConfiguration(iceCfg())}catch(e){}await C.pc.setRemoteDescription({type:d.reoffer.type,sdp:d.reoffer.sdp});const a=await C.pc.createAnswer();await C.pc.setLocalDescription(a);await C.ref.update({reanswer:{type:a.type,sdp:a.sdp,n:d.reoffer.n}})}catch(e){console.warn('re-answer',e)}})();
  }

    C.pc.setRemoteDescription({type:d.reanswer.type,sdp:d.reanswer.sdp}).then(()=>{C.restarting=false}).catch(e=>{console.warn(e);C.restarting=false});
  }

/* ----- connection quality (signal bars) ----- */
async function callQuality(C){
  if(!C.pc||C.state!=='live')return;
  try{
    const st=await C.pc.getStats();let rtt=null,lost=0,recv=0;
    st.forEach(r=>{if(r.type==='candidate-pair'&&r.nominated&&r.state==='succeeded'&&r.currentRoundTripTime!=null)rtt=r.currentRoundTripTime;if(r.type==='inbound-rtp'&&r.kind==='audio'){lost=r.packetsLost||0;recv=r.packetsReceived||0}});
    const dl=lost-(C._lost||0),dr=recv-(C._recv||0);C._lost=lost;C._recv=recv;const loss=dr+dl>0?dl/(dr+dl):0;
    let q=3;if((rtt&&rtt>.45)||loss>.08)q=1;else if((rtt&&rtt>.22)||loss>.03)q=2;if(C.netWarn)q=0;
    if(q!==C.q){C.q=q;const e=$('#call .kq');if(e)e.className='kq q'+q}
  }catch(e){}
}

/* ---------- 1. echo: lower my microphone while the other side is talking ----------
   When a phone plays the other person's voice on the loudspeaker, its microphone hears it and
   sends it back, so they hear themselves again and again. While their voice is playing here and
   I'm not talking louder than it, my microphone is turned down, which breaks the loop. */
function prepDuckCtx(C){
  if(!C||C._ac)return;
  try{C._ac=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});C._ac.resume().catch(()=>{})}catch(e){C._ac=null}
}
function startDuck(C){
  if(!C||C._duck||!C.pc||!C.local||!C._ac)return;
  const ac=C._ac;if(ac.state!=='running'){ac.resume().catch(()=>{});return}
  if(!C.remote.getAudioTracks().length)return;
  try{
    const sender=C.pc.getSenders().find(s=>s.track&&s.track.kind==='audio');if(!sender)return;
    const mic=ac.createMediaStreamSource(C.local),gain=ac.createGain(),dest=ac.createMediaStreamDestination();
    mic.connect(gain);gain.connect(dest);
    const ma=ac.createAnalyser();ma.fftSize=1024;mic.connect(ma);
    const ra=ac.createAnalyser();ra.fftSize=1024;ac.createMediaStreamSource(new MediaStream(C.remote.getAudioTracks())).connect(ra);
    const out=dest.stream.getAudioTracks()[0];if(!out)return;
    const orig=sender.track;sender.replaceTrack(out).catch(()=>{});
    const buf=new Float32Array(1024),lvl=a=>{a.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i+=2)s+=buf[i]*buf[i];return Math.sqrt(s/(buf.length/2))};
    let hold=0,mine=0;
    const iv=setInterval(()=>{
      if(CALL!==C||ac.state==='closed'){clearInterval(iv);return}
      const r=lvl(ra),m=lvl(ma),now=ac.currentTime;
      if(m>Math.max(.025,r*1.6))mine=now+.25;                 /* I'm clearly talking */
      if(r>.02&&now>mine)hold=now+.4;                          /* they're talking: duck for a moment after */
      const duck=now<hold&&now>mine;
      gain.gain.setTargetAtTime(duck?(C.speaker===false?.25:.06):1,now,duck?.012:.1);
      C.duckOn=duck;
    },25);
    C._duck={iv,orig,out};
  }catch(e){console.warn('duck',e)}
}
function stopDuck(C){if(!C)return;try{C._duck&&clearInterval(C._duck.iv)}catch(e){}try{C._ac&&C._ac.close()}catch(e){}C._duck=null;C._ac=null}

async function backupNow(silent){
  const done=[];
  try{
    ST.backup=ST.backup||{};ST.backup.sounds=ST.backup.sounds||{};
    for(const kind of ['msg','group','call']){
      const c=await Sound.getCustom(kind);if(!c)continue;
      const sig=c.name+'|'+(c.blob&&c.blob.size);if(ST.backup.sounds[kind]&&ST.backup.sounds[kind].sig===sig)continue;
      if(c.blob.size>14*1048576)continue;

  return ref.getDownloadURL();

/* ================= live subscriptions ================= */
function onChats(s){
  const next={};s.docs.forEach(d=>{next[d.id]={id:d.id,...d.data()}});
  // broadcasts I own are not in members query results' recipients: keep targets as members for UI
  for(const id in next){const c=next[id];if(c.type==='broadcast')c.members=[ME,...(c.targets||[])]}
  if(!firstChats){
    for(const id in next){const c=next[id],o=CH[id];
      if(c.last&&c.last.by!==ME&&(!o||!o.last||o.last.t<c.last.t)&&!isBlocked(c.last.by)){
        if((CUR!==id||document.hidden)&&!isRequest(c)){banner(c);if(!isMuted(id)){beep(c.type==='group'?'group':'msg');vibrate();if(document.hidden&&!(c.type==='group'&&!S().notif.groups))sysNotify(chatMeta(c).name,S().notif.preview?((c.type==='group'?pshort(c.last.by)+': ':'')+(c.last.text||'')):'הודעה חדשה',{cid:id})}}
        if(pref(id).archived&&!S().keepArchived){pref(id).archived=false;saveState()}
        if(pref(id).hiddenChat){delete pref(id).hiddenChat;saveState()}
      }
    }
  }
  firstChats=false;
  // delivered receipts
  for(const id in next){const c=next[id];if(c.last&&c.last.by!==ME&&(c.dlv?.[ME]||0)<c.last.t&&!dlvPending[id]){dlvPending[id]=1;setTimeout(()=>{delete dlvPending[id];qw('chats/'+id,()=>db.doc('chats/'+id).update({dlv:{[ME]:Date.now()}}))},800)}}
  CH=next;
  if(CUR&&!CH[CUR]){closeChat()}
  else if(CUR){drawHead();drawPinbar();const cs=canSendIn(CH[CUR]);if(cs!==lastCS&&!REC){lastCS=cs;drawComposer()}if(MS[CUR]?.loaded)drawMsgs();markRead()}
  refresh();checkHashJoin();
  if(pendingOpen&&CH[pendingOpen]){const x=pendingOpen;pendingOpen=null;history.replaceState(null,'',location.pathname+location.search);openChat(x)}
}
const dlvPending={};let lastCS=null;
function subscribeAll(){
  db.collection('profiles').onSnapshot(s=>{const n={};s.docs.forEach(d=>n[d.id]=d.data());PUB=n;P=mergeP();refresh();scheduleShare();if(CUR){drawHead()}},dbErr);
  db.collection('chats').where('members','array-contains',ME).onSnapshot(onChats,dbErr);
  subscribeStatus();subscribeShared();
  db.collection('channels').onSnapshot(s=>{const n={};s.docs.forEach(d=>n[d.id]=d.data());CHN=n;refresh()},dbErr);
  db.collection('comms').where('members','array-contains',ME).onSnapshot(s=>{const n={};s.docs.forEach(d=>n[d.id]=d.data());COMM=n;refresh()},dbErr);
}
function checkHashJoin(){
  const h=(location.hash||'').slice(1);if(!h||!/^g[a-z0-9]{6,}$/.test(h)||!READY)return;
  if(CH[h]){if(CUR!==h)openChat(h);history.replaceState(null,'',location.pathname+location.search);return}
  if($('#sheet'))return;
  db.doc('chats/'+h).get().then(s=>{if(!s.exists)return;const d=s.data();if(d.type!=='group')return;
    history.replaceState(null,'',location.pathname+location.search);
    openSheet('הזמנה לקבוצה',`<div class="joincard">${av({name:d.name,photo:d.photo,color:d.color||colorFor(h),kind:'group'},80)}<h3>${esc(d.name)}</h3><p class="ptext">${d.members.length} משתתפים</p></div><div class="btns"><button class="btn ghost" data-a="closeSheet">לא עכשיו</button><button class="btn" data-a="joinGroup" data-c="${h}">הצטרפות לקבוצה</button></div>`)}).catch(()=>{});
}

const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),ms))]);
function dbProblem(code){
  gate('none');$('#gate')?.remove();
  const T={
    'permission-denied':['כללי האבטחה חוסמים את הגישה','ב־Firebase: Firestore Database ← Rules. ודאו שהדבקתם את הכללים של SpicyyChat במקום מה שהיה שם, ולחצו Publish. אחרי דקה רעננו את הדף.'],
    'not-found':['בסיס הנתונים לא נמצא','ב־Firebase: Firestore Database. אם מופיע כפתור Create database, צרו אותו (מזהה (default), production mode). אם יצרתם בסיס נתונים עם שם אחר, צרו גם אחד עם המזהה (default).'],
    'timeout':['אין תשובה מבסיס הנתונים','בדרך כלל זה אומר שבסיס הנתונים עוד לא נוצר, או שנוצר עם מזהה שאינו (default). בדקו ב־Firebase ← Firestore Database. אם הכול תקין, בדקו את החיבור לאינטרנט ורעננו.'],
    'unavailable':['אין תשובה מבסיס הנתונים','בדקו את החיבור לאינטרנט. אם הוא תקין, ודאו ב־Firebase ← Firestore Database שבסיס הנתונים נוצר.'],
  };
  const [t,d]=T[code]||['לא הצלחנו להתחבר לשרת','קוד השגיאה: '+code+'. שלחו אותו למי שהקים את האפליקציה.'];
  const el=document.createElement('div');el.className='gate';el.id='gate';
  el.innerHTML=`<div class="onbc"><div class="logo">Spicyy<b>Chat</b></div><h3 style="margin:8px 0">${esc(t)}</h3><p>${esc(d)}</p><p class="small" dir="ltr">${esc(String(code))}</p><div class="btns"><button class="btn" onclick="location.reload()">ניסיון חוזר</button><button class="btn ghost" id="gout">יציאה מהחשבון</button></div></div>`;
  $('#layers').appendChild(el);$('#gout',el).onclick=()=>fauth.signOut().then(()=>location.reload());
}
async function afterLogin(){
  gate('loading');assets=true;
  try{await withTimeout(FDB.doc('profiles/'+ME).get({source:'server'}),12000)}
  catch(e){const code=(e&&e.code)||'unknown';console.warn('db check',e);if(code!=='failed-precondition'){dbProblem(code);return}}
  try{const s=await db.doc(`data/users/${ME}/state`).get();ST=s.exists?{...blankState(),...clone(s.data())}:blankState()}catch(e){ST=blankState()}
  ST.settings={...DEFAULTS(),...(ST.settings||{})};['notif','privacy','account','access'].forEach(k=>ST.settings[k]={...DEFAULTS()[k],...(ST.settings[k]||{})});
  applySettings();
  try{const p=await db.doc('profiles/'+ME).get();if(p.exists)P[ME]=p.data()}catch(e){}
  await loadFull();
  for(const f of [subscribeAll,startPresence,listenIncoming,subscribeLog,registerSW]){try{f()}catch(e){console.error(f.name,e)}}
  gate('none');
  if(!P[ME]){drawNav();drawSide();$('#main').innerHTML=emptyMain();onboarding()}
  else start();
}
async function boot(){
  gate('loading');
  if(!window.firebase){gate('nohost');return}
  if(!CFG.firebase||!CFG.firebase.apiKey||/PASTE|הדביקו/.test(CFG.firebase.apiKey)){gate('setup');return}
  try{fb=firebase.initializeApp(CFG.firebase)}catch(e){gate('setup');return}
  fauth=firebase.auth();FDB=firebase.firestore();
  try{FDB.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  try{await withTimeout(FDB.enablePersistence({synchronizeTabs:true}),3000)}catch(e){}
  db=wrapDB(FDB);
  fauth.getRedirectResult().catch(authErr);
  fauth.onAuthStateChanged(u=>{
    if(!u){if(READY||ME){location.reload();return}authScreen();return}
    if(ME===u.uid)return;
    ME=u.uid;user={id:async()=>u.uid,name:async()=>u.displayName||'',can:async()=>true};
    $('#auth')?.remove();afterLogin();
  });
}
ST=blankState();
boot();
